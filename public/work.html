<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work — Gonzalo Cáceres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  try{var s=sessionStorage.getItem('gc-theme');if(s)document.documentElement.setAttribute('data-theme',s)}catch(e){}
</script>
<style>
  :root{
    --paper:#ffffff;
    --ink:#0f1216;
    --rule:#d8d6d1;
    --mute:#7b7d80;
    --live:#1a2ce0;
    --ring:#c9c6c0;
    --font:"Archivo","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
    --pad:clamp(1rem,4vw,2.5rem);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0d0e10;
      --ink:#f2f1ee;
      --rule:#2b2d30;
      --mute:#8b8d90;
      --live:#7d8bff;
      --ring:#4b4d51;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0d0e10;
    --ink:#f2f1ee;
    --rule:#2b2d30;
    --mute:#8b8d90;
    --live:#7d8bff;
    --ring:#4b4d51;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font);
    font-size:16px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--live);outline-offset:3px}

  .bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:1rem;
    padding:1.1rem var(--pad);
    font-family:var(--mono);
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .bar nav{position:relative;display:flex;align-items:center;gap:1.25rem}
  .bar a:hover{color:var(--live)}
  .bar a[aria-current="page"]{color:var(--live)}
  /* the mobile-only settings icon and its popover (dark mode + language); hidden on desktop, where the
     plain labelled switch above is already clear enough on its own */
  .settings-btn{display:none;color:var(--ink)}
  .settings-btn svg circle{fill:var(--paper)}
  .settings-panel{
    display:none;
    position:absolute;right:0;top:calc(100% + .7rem);
    min-width:11rem;
    background:var(--paper);
    border:1px solid var(--rule);
    padding:.9rem 1rem;
    z-index:30;
    box-shadow:0 10px 28px rgba(0,0,0,.14);
  }
  .settings-panel.on{display:block}
  .settings-row{display:flex;align-items:center;justify-content:space-between;gap:1.25rem}
  .settings-row + .settings-row{margin-top:.85rem}
  .lang-toggle{display:flex;border:1px solid var(--rule)}
  .lang-opt{
    font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;
    padding:.3rem .6rem;color:var(--mute);transition:background .2s,color .2s;
  }
  .lang-opt.is-on{background:var(--ink);color:var(--paper)}

  .gv-mark{
    display:block;
    width:230px;
    font-family:'Archivo',sans-serif;
    font-weight:300;
    font-size:14px;
    color:var(--ink);
    text-decoration:none;
  }
  .gv-mark__line{display:flex;justify-content:space-between;line-height:1}
  .gv-mark__gap{flex:0 0 .8em}
  .gv-mark__line + .gv-mark__line > span:first-child{margin-left:.047em}
  .gv-mark__line + .gv-mark__line > span:last-child{margin-right:.046em}
  .gv-mark__flip{
    display:inline-block;
    transform:scaleX(-1);
    transition:transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .gv-mark:hover .gv-mark__flip,
  .gv-mark:focus-visible .gv-mark__flip{transform:scaleX(1)}

  .switch{
    display:inline-flex;
    align-items:center;
    gap:.55rem;
    font-family:var(--mono);
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .switch:hover .switch-label{color:var(--live)}
  .switch-track{
    position:relative;flex:0 0 auto;
    width:32px;height:18px;
    border-radius:6px;
    background:var(--rule);
    transition:background .25s ease;
  }
  .switch[aria-checked="true"] .switch-track{background:var(--live)}
  .switch-knob{
    position:absolute;top:2px;left:2px;
    width:14px;height:14px;
    border-radius:3px;
    background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.35),0 1px 1px rgba(0,0,0,.18);
    transition:transform .25s cubic-bezier(.2,.7,.2,1);
  }
  .switch[aria-checked="true"] .switch-knob{transform:translateX(14px)}

  .mono{
    font-family:var(--mono);
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  @media (max-width:640px){
    .gv-mark{width:170px;font-size:10.5px}
    .bar{gap:1.75rem}
    .bar nav{gap:.85rem}
    .bar > nav > .switch{display:none}
    .settings-btn{display:flex;align-items:center;justify-content:center;padding:.3rem}
  }
  /* the smallest phones (320 to 380 px): with Work in the menu the header no longer fits at the sizes above */
  @media (max-width:380px){
    .gv-mark{width:146px;font-size:9px}
    .bar{gap:.9rem;font-size:.7rem}
    .bar nav{gap:.6rem}
  }

  /* ---------- the sphere ---------- */
  /* the header floats over the sphere, as on the reference site; the cards pass underneath it */
  /* a fade from the page colour keeps the name and the links readable over the pictures */
  .bar{position:fixed;top:0;left:0;right:0;z-index:10;pointer-events:none;padding-bottom:2.2rem;
       background:linear-gradient(var(--paper) 45%,color-mix(in srgb,var(--paper) 0%,transparent))}
  .bar > *{pointer-events:auto}
  /* The page is two screens tall on desktop: the sphere stays put (sticky) while scrolling down steps the
     camera back, from full size to half (see the script). A touch screen gets one screen, since dragging there
     turns the sphere instead of scrolling. */
  .scroller{height:100vh;height:100svh}
  @media (hover:hover) and (pointer:fine){ .scroller{height:200vh} }
  .stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;touch-action:none}
  .sphere{
    position:absolute;inset:0;
    isolation:isolate;                 /* the cards' depth order (z-index) stays inside the sphere */
    cursor:grab;
    user-select:none;-webkit-user-select:none;
    transform-origin:50% 50%;
  }
  .sphere.is-dragging{cursor:grabbing}
  .sphere-item{position:absolute;left:50%;top:50%;width:max-content;will-change:transform}
  /* the block each card grows as during the opening, before it fades off the picture */
  .sphere-veil{position:absolute;inset:0;z-index:2;background:var(--ink);pointer-events:none}

  .card{display:block;position:relative;width:var(--card,500px);-webkit-user-drag:none}
  .sphere.is-dragging .card{cursor:grabbing}
  .card img{display:block;width:100%;height:auto;-webkit-user-drag:none;pointer-events:none}
  /* a project with no pictures yet: its colour, striped as on the home page, with its name */
  .card .ph{
    display:flex;align-items:flex-end;
    aspect-ratio:4/5;
    padding:calc(var(--card,500px) * .05);
    font-weight:800;font-size:calc(var(--card,500px) * .08);line-height:1;letter-spacing:-.02em;
    color:#fff;
  }
  /* the name, shown while the pointer is on a card. Cards are drawn at a third to four fifths of their size,
     so the label is set large here to read at about the size of the site's other mono captions */
  .card .cap{
    position:absolute;left:0;bottom:0;
    max-width:100%;
    padding:.3em .6em;
    font-family:var(--mono);font-size:calc(var(--card,500px) * .042);
    text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
    background:var(--paper);color:var(--ink);
    opacity:0;transition:opacity .25s ease;
  }
  .card .cap i{font-style:normal;color:var(--mute);margin-left:.8em}
  @media (hover:hover){ .card:hover .cap{opacity:1} }
  .card:focus-visible{outline:4px solid var(--live);outline-offset:4px}
  .card:focus-visible .cap{opacity:1}

  .hint{
    position:fixed;left:0;right:0;bottom:0;z-index:10;margin:0;
    padding:2.2rem var(--pad) 1.1rem;
    background:linear-gradient(color-mix(in srgb,var(--paper) 0%,transparent),var(--paper) 55%);
    color:var(--mute);font-size:.68rem;letter-spacing:.03em;
    pointer-events:none;
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<header class="bar">
  <a href="/" class="gv-mark" aria-label="Gonzalo Cáceres Valcárcel — home">
    <span class="gv-mark__line">
      <span>G</span><span>O</span><span class="gv-mark__flip">N</span><span>Z</span><span>A</span><span>L</span><span>O</span>
      <span class="gv-mark__gap">&nbsp;</span>
      <span>C</span><span>Á</span><span>C</span><span>E</span><span class="gv-mark__flip">R</span><span>E</span><span>S</span>
    </span>
    <span class="gv-mark__line">
      <span>V</span><span>A</span><span class="gv-mark__flip">L</span><span>C</span><span>Á</span><span>R</span><span>C</span><span>E</span><span>L</span>
    </span>
  </a>
  <nav>
    <a href="work.html" aria-current="page">Work</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <button class="switch theme-switch" id="theme" role="switch" aria-checked="false" aria-label="Dark mode">
      <span class="switch-label">Dark mode</span>
      <span class="switch-track"><span class="switch-knob"></span></span>
    </button>
    <!-- mobile only: the desktop switch above is hidden below 640px and replaced by this icon, which opens
         dark mode + language in one place instead of a bare, unlabelled toggle -->
    <button class="settings-btn" id="settingsBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"></line><circle cx="15" cy="6" r="2.1"></circle>
        <line x1="3" y1="12" x2="21" y2="12"></line><circle cx="9" cy="12" r="2.1"></circle>
        <line x1="3" y1="18" x2="21" y2="18"></line><circle cx="17" cy="18" r="2.1"></circle>
      </svg>
    </button>
    <div class="settings-panel" id="settingsPanel" hidden>
      <div class="settings-row">
        <span class="mono">Dark mode</span>
        <button class="switch theme-switch" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
          <span class="switch-track"><span class="switch-knob"></span></span>
        </button>
      </div>
      <div class="settings-row">
        <span class="mono">Language</span>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" class="lang-opt is-on" data-lang="en">EN</button>
          <button type="button" class="lang-opt" data-lang="es">ES</button>
        </div>
      </div>
    </div>
  </nav>
</header>

<main class="scroller">
  <h1 class="mono" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Work</h1>
  <div class="stage">
    <div class="sphere" id="sphere"></div>
  </div>
</main>
<p class="hint mono" id="hint">Drag to turn</p>

<script src="projects.js"></script>
<script src="sphere.js"></script>

<script>
(function(){
  var switches = Array.prototype.slice.call(document.querySelectorAll('.theme-switch'));
  function isDark(){
    var a = document.documentElement.getAttribute('data-theme');
    if(a === 'dark') return true;
    if(a === 'light') return false;
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function sync(){ switches.forEach(function(b){ b.setAttribute('aria-checked', isDark() ? 'true' : 'false'); }); }
  sync();
  switches.forEach(function(b){
    b.addEventListener('click', function(){
      var next = isDark() ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try{ sessionStorage.setItem('gc-theme', next); }catch(e){}
      sync();
    });
  });

  // the site follows the system theme; the switch only overrides it for this visit
  try{
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    mq.addEventListener('change', function(){
      document.documentElement.removeAttribute('data-theme');
      try{ sessionStorage.removeItem('gc-theme'); }catch(e){}
      sync();
    });
  }catch(e){}

  // mobile-only settings popover: dark mode (above) and language, behind one icon instead of a bare toggle
  var settingsBtn = document.getElementById('settingsBtn'), settingsPanel = document.getElementById('settingsPanel');
  if(settingsBtn && settingsPanel){
    var closeSettings = function(){
      settingsPanel.classList.remove('on');
      settingsBtn.setAttribute('aria-expanded', 'false');
      setTimeout(function(){ if(!settingsPanel.classList.contains('on')) settingsPanel.hidden = true; }, 0);
    };
    settingsBtn.addEventListener('click', function(e){
      e.stopPropagation();
      if(settingsPanel.classList.contains('on')){ closeSettings(); return; }
      settingsPanel.hidden = false;
      settingsPanel.classList.add('on');
      settingsBtn.setAttribute('aria-expanded', 'true');
    });
    document.addEventListener('click', function(e){
      if(settingsPanel.classList.contains('on') && !settingsPanel.contains(e.target) && e.target !== settingsBtn) closeSettings();
    });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeSettings(); });
  }

  // language: EN / ES. Remembers the choice for next time; there is no translated copy anywhere on the
  // site yet, so for now this only changes which button is marked on — it doesn't change any page text.
  var langBtns = Array.prototype.slice.call(document.querySelectorAll('.lang-opt'));
  if(langBtns.length){
    var syncLang = function(lang){
      langBtns.forEach(function(b){ b.classList.toggle('is-on', b.getAttribute('data-lang') === lang); });
    };
    var savedLang = 'en';
    try{ savedLang = localStorage.getItem('gc-lang') || 'en'; }catch(e){}
    syncLang(savedLang);
    langBtns.forEach(function(b){
      b.addEventListener('click', function(){
        var lang = b.getAttribute('data-lang');
        syncLang(lang);
        try{ localStorage.setItem('gc-lang', lang); }catch(e){}
      });
    });
  }
})();
</script>

<script>
// Every project on one turning sphere (sphere.js). The pictures come from projects.js, so a project shows up here as
// soon as it has any; one that has none yet shows as its colour with its name. Each card opens its project.
(function(){
  var root = document.getElementById('sphere');
  var P = window.PROJECTS || {};

  // each project's pictures: hero first, then the diagram, drawings, physical models, photos
  function picturesOf(pr){
    var g = pr.gallery || {}, out = [];
    function add(src){ if(src && out.indexOf(src) === -1) out.push(src); }
    add(pr.hero);
    if(pr.diagram) add(pr.diagram.src);
    ['drawings', 'physical', 'photos'].forEach(function(sec){ (g[sec] || []).forEach(function(it){ add(it.src); }); });
    return out;
  }
  // dealt out one per project in turn, so neighbouring cards on the sphere mostly belong to different projects.
  // Card 0 starts in front, so the finished projects go first.
  var slugs = Object.keys(P).sort(function(a, b){ return (P[b].ready ? 1 : 0) - (P[a].ready ? 1 : 0); });
  var decks = slugs.map(function(s){ var l = picturesOf(P[s]); return {slug: s, list: l.length ? l : [null]}; });
  var entries = [];
  for(var round = 0, more = true; more; round++){
    more = false;
    decks.forEach(function(d){
      if(round < d.list.length){ entries.push({slug: d.slug, src: d.list[round]}); more = true; }
    });
  }

  // the light preview copy made by tools/thumbs.py; the original if there isn't one yet
  function thumb(src){ return /^img\//.test(src) ? 'img/thumbs/' + src.slice(4).replace(/\.[^.\/]+$/, '') + '.webp' : src; }
  function swatch(h){
    return 'repeating-linear-gradient(135deg, hsl(' + h + ' 30% 62%) 0 6px, hsl(' + h + ' 30% 68%) 6px 12px)';
  }

  function makeCard(e, onReady){
    var pr = P[e.slug];
    var a = document.createElement('a');
    a.className = 'card';
    a.href = 'project.html?p=' + e.slug;
    a.setAttribute('draggable', 'false');
    a.setAttribute('aria-label', pr.title);
    if(e.src){
      var img = new Image();
      img.alt = '';
      img.decoding = 'async';
      img.setAttribute('draggable', 'false');
      img.onload = onReady;
      img.onerror = function(){
        if(img.getAttribute('src') !== e.src){ img.src = e.src; return; }
        img.remove();
        a.insertBefore(placeholder(pr), a.firstChild);
        onReady();
      };
      img.src = thumb(e.src);
      a.appendChild(img);
    } else {
      a.appendChild(placeholder(pr));
      onReady();
    }
    var cap = document.createElement('span');
    cap.className = 'cap';
    cap.textContent = pr.title;
    if(pr.kicker){ var k = document.createElement('i'); k.textContent = pr.kicker; cap.appendChild(k); }
    a.appendChild(cap);
    return a;
  }
  function placeholder(pr){
    var ph = document.createElement('span');
    ph.className = 'ph';
    ph.style.background = swatch(pr.hue || 0);
    ph.textContent = pr.title;
    return ph;
  }

  // the reference site's two settings: a wide, flatter sphere on desktop, a narrow, tall one with smaller cards on a phone
  var narrow = window.matchMedia('(max-width: 809px)');
  var gallery = null;
  function build(){
    if(gallery) gallery.destroy();
    var small = narrow.matches;
    root.style.setProperty('--card', small ? '250px' : '500px');
    var opts = small ? {radius: 700, height: 1800, duration: 90} : {radius: 1600, height: 1100, duration: 120};
    var waiting = entries.length, started = false, g;
    function go(){ if(!started){ started = true; g.start(); } }
    function ready(){ if(--waiting <= 0) go(); }
    var cards = entries.map(function(e){ return {el: makeCard(e, ready)}; });
    g = gallery = SphereGallery(root, cards, opts);
    if(waiting <= 0) go();
    setTimeout(go, 4000);      // never wait on a slow picture for long
  }
  build();
  if(narrow.addEventListener) narrow.addEventListener('change', build);

  // scrolling down steps the camera back: the whole sphere eases from full size to half
  var target = 1, scale = 1, ticking = false;
  function onScroll(){
    var max = document.documentElement.scrollHeight - window.innerHeight;
    target = 1 - .5 * (max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0);
    if(!ticking){ ticking = true; requestAnimationFrame(ease); }
  }
  function ease(){
    scale += (target - scale) * .14;
    if(Math.abs(target - scale) < .0005) scale = target;
    root.style.transform = scale === 1 ? '' : 'scale(' + scale.toFixed(4) + ')';
    if(scale !== target) requestAnimationFrame(ease); else ticking = false;
  }
  window.addEventListener('scroll', onScroll, {passive: true});
  window.addEventListener('resize', onScroll);

  var coarse = window.matchMedia('(pointer: coarse)').matches;
  var mac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  document.getElementById('hint').textContent = coarse
    ? 'Drag to turn · pinch to zoom'
    : 'Drag to turn · scroll to step back · ' + (mac ? '⌘' : 'Ctrl') + ' + scroll to zoom';
})();
</script>

<script src="signature.js"></script>
</body>
</html>
