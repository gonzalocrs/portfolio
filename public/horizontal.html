<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gonzalo Cáceres — Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- TEST: the whole site as one sideways strip (after lumenary.framer.website). The vertical wheel moves it sideways;
     on a phone it falls back to a plain vertical column. Home and project pages are both this file: horizontal.html is
     the strip of all the work, horizontal.html?p=<slug> is one project. Content comes from projects.js as usual. -->
<style>
  :root{
    --paper:#ffffff;
    --ink:#0f1216;
    --rule:#d8d6d1;
    --mute:#7b7d80;
    --live:#1a2ce0;
    --void:#ecebe8;              /* the grey of a picture that is not there yet */
    --font:"Archivo","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
    --gut:clamp(1rem,4vw,2.5rem);
    --bar:4.2rem;                /* header and footer are fixed heights so the pictures can take exactly what is left */
    --foot:3.6rem;
    --cap:1.9rem;                /* room for one caption line under every picture */
    --h:calc(100svh - var(--bar) - var(--foot) - 1.6rem);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0d0e10; --ink:#f2f1ee; --rule:#2b2d30; --mute:#8b8d90; --live:#7d8bff; --void:#1a1b1e;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0d0e10; --ink:#f2f1ee; --rule:#2b2d30; --mute:#8b8d90; --live:#7d8bff; --void:#1a1b1e;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font);
    font-size:16px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
    height:100svh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--live);outline-offset:3px}
  .mono{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}

  /* ---------- header: name, the time where Gonzalo is, links ---------- */
  .bar{
    flex:0 0 var(--bar);
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:1rem;
    padding:0 var(--gut);
    font-family:var(--mono);
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .bar nav{justify-self:end;display:flex;align-items:center;gap:1.25rem}
  .bar a:hover{color:var(--live)}
  .clock{color:var(--mute);white-space:nowrap}
  .clock b{font-weight:400;color:var(--ink);margin-left:.6rem}

  .gv-mark{display:block;width:230px;font-family:var(--font);font-weight:300;font-size:14px;text-transform:none;letter-spacing:0}
  .gv-mark__line{display:flex;justify-content:space-between;line-height:1}
  .gv-mark__gap{flex:0 0 .8em}
  .gv-mark__line + .gv-mark__line > span:first-child{margin-left:.047em}
  .gv-mark__line + .gv-mark__line > span:last-child{margin-right:.046em}
  .gv-mark__flip{display:inline-block;transform:scaleX(-1);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .gv-mark:hover .gv-mark__flip,.gv-mark:focus-visible .gv-mark__flip{transform:scaleX(1)}

  .switch{display:inline-flex;align-items:center;gap:.55rem;font-family:var(--mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
  .switch:hover .switch-label{color:var(--live)}
  .switch-track{position:relative;flex:0 0 auto;width:32px;height:18px;border-radius:6px;background:var(--rule);transition:background .25s ease}
  .switch[aria-checked="true"] .switch-track{background:var(--live)}
  .switch-knob{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:3px;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.35),0 1px 1px rgba(0,0,0,.18);transition:transform .25s cubic-bezier(.2,.7,.2,1)}
  .switch[aria-checked="true"] .switch-knob{transform:translateX(14px)}

  /* ---------- the strip ---------- */
  .track{
    flex:1 1 auto;
    min-height:0;
    overflow-x:auto;
    overflow-y:hidden;
    scrollbar-width:none;          /* the footer line shows where you are instead */
    overscroll-behavior-x:contain;
  }
  .track::-webkit-scrollbar{display:none}
  .strip{
    display:flex;
    align-items:flex-start;
    width:max-content;
    height:100%;
    padding:.6rem var(--gut) 1rem;
  }

  /* one picture: always whole, never cropped; its height is set and its width follows its own proportions */
  .fig{margin:0;flex:0 0 auto;display:flex;flex-direction:column;height:var(--h)}
  .fig img{display:block;height:calc(var(--h) - var(--cap));width:auto;aspect-ratio:var(--a,1.5);background:var(--void);
    transition:opacity .35s ease}
  .fig img.is-in{background:none}
  .fig figcaption{margin-top:.55rem;color:var(--mute);white-space:nowrap}
  /* a smaller picture hangs from the top or stands on the bottom line, so the strip does not read as one flat band */
  .fig.s img{height:calc((var(--h) - var(--cap)) * .68)}
  .fig.m img{height:calc((var(--h) - var(--cap)) * .82)}
  .fig.low{justify-content:flex-end}
  .fig + .fig{margin-left:1.25rem}
  .pair{display:flex;flex:0 0 auto}
  .pair .fig + .fig{margin-left:.6rem}    /* a drawing and the photo of the same view sit closer together */
  .pair + .fig,.fig + .pair,.pair + .pair{margin-left:1.25rem}
  .void{display:flex;align-items:flex-end;padding:.8rem;height:calc((var(--h) - var(--cap)) * .55);aspect-ratio:3/4;background:var(--void);color:var(--mute)}

  /* ---------- home: an index, then each project after the other ---------- */
  .intro{flex:0 0 auto;width:19rem;height:var(--h);display:flex;flex-direction:column;justify-content:space-between;margin-right:clamp(3rem,7vw,7rem)}
  .index{list-style:none;margin:1.4rem 0 0;padding:0}
  .index h2{margin:0 0 .3rem;font-weight:800;font-size:clamp(1.35rem,2.1vw,1.9rem);line-height:1.15;letter-spacing:-.02em}
  .index > li + li{margin-top:1.3rem}
  .index ul{list-style:none;margin:0;padding:0}
  .index ul a{display:flex;justify-content:space-between;gap:1rem;padding:.12rem 0;transition:color .2s}
  .index ul a span:last-child{color:var(--mute)}
  .index ul a:hover,.index ul a:focus-visible{color:var(--live)}
  .hint{color:var(--mute);display:flex;align-items:center;gap:.6rem}
  .hint i{display:inline-block;width:2.2rem;height:1px;background:currentColor;position:relative}
  .hint i::after{content:"";position:absolute;right:0;top:-3px;width:7px;height:7px;border-top:1px solid;border-right:1px solid;transform:rotate(45deg);transform-origin:100% 0}

  .proj{display:flex;flex:0 0 auto;align-items:flex-start}
  .proj + .proj{margin-left:clamp(4rem,9vw,9rem)}
  .proj.is-off{display:none}
  .label{flex:0 0 auto;width:13.5rem;height:var(--h);display:flex;flex-direction:column;justify-content:space-between;padding-right:1.5rem}
  .label .num{color:var(--mute)}
  .label h3{margin:.5rem 0 0;font-weight:800;font-size:clamp(1.5rem,2.4vw,2.2rem);line-height:1.02;letter-spacing:-.02em}
  .label p{margin:.7rem 0 0;color:var(--mute)}
  .label .go{color:var(--ink);transition:color .2s}
  .label .go:hover,.proj a:focus-visible .go{color:var(--live)}
  .proj a.pic{display:block;flex:0 0 auto}
  .proj a.pic:hover img{opacity:.88}

  /* ---------- a project: text, then its pictures, then the next project ---------- */
  .info{flex:0 0 auto;width:min(26rem,80vw);height:var(--h);display:flex;flex-direction:column;justify-content:space-between;
    margin-right:clamp(2.5rem,5vw,5rem);overflow-y:auto;scrollbar-width:none}
  .info::-webkit-scrollbar{display:none}
  .info h1{margin:.5rem 0 0;font-weight:800;font-size:clamp(1.8rem,3.4vw,3.24rem);line-height:1;letter-spacing:-.02em}
  .info .kicker{margin:.8rem 0 0;color:var(--mute)}
  .info .lede{margin:1.6rem 0 0;font-size:clamp(1.05rem,1.4vw,1.3rem);line-height:1.35}
  .info .text{margin:1.1rem 0 0;color:var(--mute);line-height:1.6}
  .more-toggle{margin-top:1rem;color:var(--ink)}
  .more-toggle:hover{color:var(--live)}
  .credits{display:grid;grid-template-columns:auto 1fr;gap:.25rem 1.2rem;margin:1.6rem 0 0;font-size:.85rem}
  .credits dt{color:var(--mute);font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;padding-top:.15rem}
  .credits dd{margin:0}
  /* "Read more" opens the other paragraphs as columns beside the first one, so the text also reads sideways */
  .more{display:flex;flex:0 0 auto;gap:2.5rem;height:var(--h);margin-right:clamp(2.5rem,5vw,5rem);padding-top:1.4rem}
  .more[hidden]{display:none}
  .more p{margin:0;width:min(24rem,78vw);color:var(--mute);line-height:1.6}
  .next{flex:0 0 auto;display:flex;align-items:flex-start;gap:1.5rem;margin-left:clamp(5rem,10vw,10rem);height:var(--h)}
  .next .label{width:auto;max-width:18rem}
  .next .label h3{font-size:clamp(1.8rem,3.4vw,3.24rem)}
  .next a:hover h3{color:var(--live)}

  /* ---------- footer: filter, where you are, step arrows ---------- */
  .foot{
    flex:0 0 var(--foot);
    display:flex;
    align-items:center;
    gap:clamp(1rem,3vw,2.5rem);
    padding:0 var(--gut);
  }
  .filters{display:flex;gap:1.1rem;font-weight:800;font-size:1rem;letter-spacing:-.01em;white-space:nowrap}
  .filters button{color:var(--mute);transition:color .2s}
  .filters button:hover{color:var(--ink)}
  .filters button[aria-pressed="true"]{color:var(--live)}
  .back{font-weight:800;font-size:1rem;letter-spacing:-.01em;white-space:nowrap}
  .back:hover{color:var(--live)}
  .progress{flex:1 1 auto;height:1px;background:var(--rule);position:relative;min-width:3rem}
  .progress i{position:absolute;left:0;top:-.5px;height:2px;width:100%;background:var(--ink);transform-origin:0 50%;transform:scaleX(0)}
  .where{min-width:11rem;text-align:right;white-space:nowrap;color:var(--mute)}
  .where b{font-weight:400;color:var(--ink)}
  .steps{display:flex;gap:.4rem}
  .steps button{width:2.1rem;height:2.1rem;display:flex;align-items:center;justify-content:center;border:1px solid var(--rule);transition:border-color .2s,color .2s}
  .steps button:hover{border-color:var(--ink)}
  .steps button:disabled{opacity:.3;cursor:default;border-color:var(--rule)}

  /* ---------- phone: the strip turns into a plain column (a sideways strip of full-height pictures is too narrow a
     window there) ---------- */
  @media (max-width:700px){
    body{height:auto;overflow:visible;display:block}
    .bar{grid-template-columns:1fr auto;height:var(--bar)}
    .clock{display:none}
    .gv-mark{width:170px;font-size:10.5px}
    .bar nav{gap:.85rem}
    .switch-label{display:none}
    .track{overflow:visible}
    .strip{display:block;width:auto;height:auto;padding:.4rem var(--gut) 5rem}
    .fig,.fig.low{height:auto;margin:0 0 1.4rem !important}
    .fig img,.fig.s img,.fig.m img{width:100%;height:auto}
    .pair{display:block}
    .intro,.label,.info,.more,.next{width:auto;height:auto;margin:0 0 1.6rem;padding:0}
    .intro .hint{display:none}
    .proj{display:block;margin:0 0 3rem !important}
    .label{margin-bottom:1rem}
    .label .go{display:none}
    .void{width:100%;height:auto}
    .more{display:block}
    .more p + p{margin-top:1rem}
    .next{display:block;margin-top:3rem}
    .foot{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);height:var(--foot)}
    .progress,.where,.steps{display:none}
  }
</style>
<script>
  // same theme rule as the rest of the site: follow the system, the switch overrides it for this visit
  try{ var t = sessionStorage.getItem('gc-theme'); if(t) document.documentElement.setAttribute('data-theme', t); }catch(e){}
</script>
</head>
<body>

<header class="bar">
  <a href="horizontal.html" class="gv-mark" aria-label="Gonzalo Cáceres Valcárcel, all work">
    <span class="gv-mark__line">
      <span>G</span><span>O</span><span class="gv-mark__flip">N</span><span>Z</span><span>A</span><span>L</span><span>O</span>
      <span class="gv-mark__gap">&nbsp;</span>
      <span>C</span><span>Á</span><span>C</span><span>E</span><span class="gv-mark__flip">R</span><span>E</span><span>S</span>
    </span>
    <span class="gv-mark__line">
      <span>V</span><span>A</span><span class="gv-mark__flip">L</span><span>C</span><span>Á</span><span>R</span><span>C</span><span>E</span><span>L</span>
    </span>
  </a>
  <span class="clock">New York<b id="clock"></b></span>
  <nav>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <button class="switch" id="theme" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
      <span class="switch-label">Dark mode</span>
      <span class="switch-track"><span class="switch-knob"></span></span>
    </button>
  </nav>
</header>

<main class="track" id="track" tabindex="-1">
  <div class="strip" id="strip"></div>
</main>

<footer class="foot" id="foot">
  <div id="footLeft"></div>
  <div class="progress" aria-hidden="true"><i id="progress"></i></div>
  <div class="where mono" id="where" aria-live="polite"></div>
  <div class="steps">
    <button type="button" id="prev" aria-label="Back">
      <svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="currentColor"><path d="M13 5H1M5 1 1 5l4 4"/></svg>
    </button>
    <button type="button" id="next" aria-label="Forward">
      <svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="currentColor"><path d="M1 5h12M9 1l4 4-4 4"/></svg>
    </button>
  </div>
</footer>

<script src="projects.js"></script>
<script src="horizontal.js"></script>
</body>
</html>
