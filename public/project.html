<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project — Gonzalo Cáceres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  try{var s=sessionStorage.getItem('gc-theme');if(s)document.documentElement.setAttribute('data-theme',s)}catch(e){}
</script>
<style>
  :root{
    --paper:#ffffff;
    --ink:#0f1216;
    --rule:#d8d6d1;
    --mute:#7b7d80;
    --live:#1a2ce0;
    --font:"Archivo","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
    --pad:clamp(1rem,4vw,2.5rem);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0d0e10;
      --ink:#f2f1ee;
      --rule:#2b2d30;
      --mute:#8b8d90;
      --live:#7d8bff;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0d0e10;
    --ink:#f2f1ee;
    --rule:#2b2d30;
    --mute:#8b8d90;
    --live:#7d8bff;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font);
    font-size:16px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--live);outline-offset:3px}

  /* ---------- top bar (same as the index) ---------- */
  .bar{
    position:sticky;      /* the ribbon stays put while a project scrolls underneath it */
    top:0;
    z-index:20;
    background:var(--paper);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:1rem;
    padding:1.1rem var(--pad);
    font-family:var(--mono);
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .bar nav{position:relative;display:flex;align-items:center;gap:1.25rem}
  .bar a:hover{color:var(--live)}
  /* the mobile-only settings icon and its popover (dark mode + language); hidden on desktop, where the
     plain labelled switch above is already clear enough on its own */
  .settings-btn{display:none;color:var(--ink)}
  .settings-btn svg circle{fill:var(--paper)}
  .settings-panel{
    display:none;
    position:absolute;right:0;top:calc(100% + .7rem);
    min-width:11rem;
    background:var(--paper);
    border:1px solid var(--rule);
    padding:.9rem 1rem;
    z-index:30;
    box-shadow:0 10px 28px rgba(0,0,0,.14);
  }
  .settings-panel.on{display:block}
  .settings-row{display:flex;align-items:center;justify-content:space-between;gap:1.25rem}
  .settings-row + .settings-row{margin-top:.85rem}
  .lang-toggle{display:flex;border:1px solid var(--rule)}
  .lang-opt{
    font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;
    padding:.3rem .6rem;color:var(--mute);transition:background .2s,color .2s;
  }
  .lang-opt.is-on{background:var(--ink);color:var(--paper)}
  /* the project name, centred in the ribbon and set exactly like ABOUT / CONTACT; it appears once you have
     left the first screen (see project.js). It is positioned, so showing it never changes the ribbon */
  .ptitle{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,calc(-50% + 4px));
    max-width:34vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    /* Archivo bold, the project-title font, in normal upper and lower case (never all capitals in this font) */
    font-family:var(--font);font-weight:800;font-size:.997rem;line-height:1.4;letter-spacing:-.01em;text-transform:none;
    color:var(--ink);
    opacity:0;pointer-events:none;
    transition:opacity .35s ease,transform .35s cubic-bezier(.2,.7,.2,1),color .2s;
  }
  .ptitle.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
  .ptitle:hover{color:var(--live)}
  @media (max-width:900px){.ptitle{display:none}}

  .gv-mark{
    display:block;
    width:230px;
    font-family:'Archivo',sans-serif;
    font-weight:300;
    font-size:14px;
    color:var(--ink);
    text-decoration:none;
  }
  .gv-mark__line{display:flex;justify-content:space-between;line-height:1}
  .gv-mark__gap{flex:0 0 .8em}
  /* optical alignment: the V lines up under the G and the last L under the S */
  .gv-mark__line + .gv-mark__line > span:first-child{margin-left:.047em}
  .gv-mark__line + .gv-mark__line > span:last-child{margin-right:.046em}
  .gv-mark__flip{
    display:inline-block;
    transform:scaleX(-1);
    transition:transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .gv-mark:hover .gv-mark__flip,
  .gv-mark:focus-visible .gv-mark__flip{transform:scaleX(1)}

  .switch{
    display:inline-flex;
    align-items:center;
    gap:.55rem;
    font-family:var(--mono);
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .switch:hover .switch-label{color:var(--live)}
  .switch-track{
    position:relative;flex:0 0 auto;
    width:32px;height:18px;
    border-radius:6px;
    background:var(--rule);
    transition:background .25s ease;
  }
  .switch[aria-checked="true"] .switch-track{background:var(--live)}
  .switch-knob{
    position:absolute;top:2px;left:2px;
    width:14px;height:14px;
    border-radius:3px;
    background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.35),0 1px 1px rgba(0,0,0,.18);
    transition:transform .25s cubic-bezier(.2,.7,.2,1);
  }
  .switch[aria-checked="true"] .switch-knob{transform:translateX(14px)}

  /* ---------- project page ---------- */
  main{
    flex:1 0 auto;
    padding:.35rem var(--pad) clamp(3rem,8vh,6rem);
  }
  .mono{
    font-family:var(--mono);
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .back{display:inline-block;margin-bottom:1.25rem;color:var(--mute);transition:color .2s}
  .back:hover{color:var(--live)}

  .hero{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    max-height:80vh;
    border:1px solid var(--rule);
    overflow:hidden;
  }

  .title{
    margin:clamp(2rem,5vw,3.5rem) 0 0;
    font-weight:800;
    font-size:clamp(1.35rem,4.14vw,3.24rem);   /* same size as the contact-page titles, -10% */
    line-height:1;
    letter-spacing:-.02em;
  }
  .kicker{margin:.9rem 0 0;color:var(--mute)}   /* -10%, matching the title's smaller size */
  .kicker a{transition:color .2s}
  .kicker a:hover{color:var(--live)}
  /* every part of a project is one full-screen segment */
  /* scroll-snap-stop:always matters specifically on mobile's mandatory snap (see html:not(.paged) below): a
     fast swipe can otherwise skip straight past this section to the next one's own snap point, never letting
     it become current — this forces every swipe to stop here first, however much momentum it had */
  .seg{position:relative;height:calc(100svh - var(--bar-h,4rem));min-height:26rem;scroll-snap-align:start;scroll-snap-stop:always;scroll-margin-top:var(--bar-h,4rem)}
  /* on mobile there's no JS paging (see project.js: pagedMQ), so a plain scroll must do the work — mandatory
     (not proximity) means a normal scroll gesture always settles cleanly on one full-height section, never
     stops halfway with two sections' content visible at once */
  html:not(.paged){scroll-snap-type:y mandatory}
  .intro.seg{scroll-margin-top:calc(var(--bar-h,4rem) + .35rem)}
  html.paged{scrollbar-width:none}
  html.paged::-webkit-scrollbar{display:none}
  .intro{
    display:flex;flex-direction:column;
    height:calc(100svh - var(--bar-h,4rem) - .35rem);
    min-height:26rem;
    padding-bottom:1.1rem; /* same distance from the bottom as the home footer line */
  }
  .intro .hero{flex:1 1 0;min-height:0;aspect-ratio:auto;max-height:none}
  .intro .title{margin-top:clamp(.9rem,2.4vh,1.6rem)}

  .info{
    display:grid;
    grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);
    gap:clamp(2rem,6vw,6rem);
    align-items:start;
    width:100%;
  }
  .seg--info{display:flex;align-items:center}
  .info.solo{grid-template-columns:minmax(0,38rem)}
  /* a project with a diagram: text + credits stack in one column on the left,
     vertically centred; the diagram permanently fills the full segment height
     on the right, right next to the text. Every other project keeps the plain
     two-column layout above, completely untouched. */
  .info.has-diagram{
    grid-template-columns:minmax(0,1.4fr) minmax(0,1.3fr);
    align-items:stretch;
    height:100%;
  }
  .info.has-diagram > .left{grid-column:1;align-self:center;min-width:0}
  .info.has-diagram .diagram{grid-column:2;height:calc(100% - 1.1rem)}  /* same bottom margin as .intro / .seg--gal */
  /* both scale down together on a narrower screen, same as the plain layout's
     .lede below — keeps the block (and the credits under it) from ever
     needing more width than the column actually has, without losing the
     vertical centering on .left */
  .info.has-diagram .lede{max-width:46ch;font-size:clamp(.95rem,1.53vw,1.35rem)}
  .info.has-diagram .text{max-width:68ch;font-size:clamp(.78rem,1vw,.9rem);margin:0 0 1.1rem}
  .info.has-diagram .text:last-of-type{margin-bottom:0}
  .lede.placeholder,.text.placeholder{font-style:italic;font-weight:400;color:var(--mute)}
  .lede{
    margin:0 0 1.4rem;
    max-width:34ch;
    font-weight:500;
    font-size:clamp(1.15rem,1.7vw,1.5rem);
    line-height:1.4;
    letter-spacing:-.015em;
  }
  .text{margin:0;max-width:52ch;font-size:1rem;line-height:1.6;color:var(--mute)}

  /* an optional sketch/diagram, full bleed (no frame, no caption), shown whole
     (contain, never cropped) next to the text — sized a little short of the
     full column height, like the next page peeking through underneath */
  .diagram{margin:0;display:flex;flex-direction:column}
  .diagram img{display:block;width:100%;flex:1 1 0;min-height:0;object-fit:contain;object-position:center top}
  /* before the real artwork exists, reserve the slot with the same roadmap
     placeholder pattern used for pending gallery images */
  .diagram.placeholder{position:relative}

  /* credits, for a diagram project, collapse into a small dropdown overlay
     below the text instead of taking up their own column */
  .info.has-diagram .credits-wrap{position:relative;max-width:68ch;margin-top:1.6rem}
  .credits-toggle{
    display:flex;align-items:center;gap:.5rem;
    background:none;border:0;padding:0;
    color:var(--mute);cursor:pointer;transition:color .2s;
  }
  .credits-toggle:hover{color:var(--ink)}
  .credits-toggle::after{
    content:"";width:.4rem;height:.4rem;
    border-right:1px solid currentColor;border-bottom:1px solid currentColor;
    transform:rotate(45deg) translateY(-2px);
    transition:transform .25s ease;
  }
  .info.has-diagram.credits-open .credits-toggle::after{transform:rotate(-135deg) translateY(1px)}
  .credits-panel{
    position:absolute;top:calc(100% + .8rem);left:0;
    /* shrinks to fit its content, but never past the column — and, as a hard
       floor under that, never past the viewport itself, however narrow */
    width:max-content;max-width:min(100%, calc(100vw - 2 * var(--pad, 1.5rem)));
    background:var(--paper);
    padding:.2rem 0;
    opacity:0;visibility:hidden;transform:translateY(-6px);
    transition:opacity .22s ease,transform .22s ease,visibility 0s linear .22s;
    z-index:5;
  }
  .info.has-diagram.credits-open .credits-panel{
    opacity:1;visibility:visible;transform:translateY(0);
    transition:opacity .22s ease,transform .22s ease;
  }
  /* compact rows, flush with the panel's edges so each row's underline lines
     up with the text above (same left/right edge, no inset) */
  .credits-panel .credits{border-bottom:0}
  .credits-panel .credits div{padding:.45rem 0}
  .credits-panel dd{overflow-wrap:break-word}
  .credits-panel dt{font-size:.66rem}
  .credits-panel dd{font-size:.85rem}
  .credits{margin:0;border-bottom:1px solid var(--rule)}
  .credits div{
    display:grid;
    grid-template-columns:8.5rem minmax(0,1fr);
    gap:1rem;
    align-items:baseline;
    padding:.65rem 0;
    border-top:1px solid var(--rule);
  }
  .credits dt{color:var(--mute)}
  .credits dd{margin:0;font-weight:500}

  /* ---------- galleries: a full-screen stage that shows every image at once ---------- */
  .seg--gal{display:flex;flex-direction:column;padding-bottom:1.1rem}
  .gal__head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:.8rem 0 1rem;
    border-top:1px solid var(--rule);
  }
  .gal__head span:last-child{color:var(--mute);transition:opacity .3s}
  /* photos & renders: free layout, no frames, no fixed height (see buildFree in project.js) */
  .seg--free{display:block;height:auto;min-height:calc(100svh - var(--bar-h,4rem));scroll-snap-align:none;padding-bottom:clamp(4rem,12vh,9rem)}
  .free{--maxh:calc(100svh - var(--bar-h,4rem) - 5rem);padding-top:clamp(2rem,7vh,5rem)}
  .free__row{container-type:inline-size;display:flex;margin-top:clamp(5rem,17vh,12rem)}
  .free__row:first-child{margin-top:0}
  .ffig{margin:0;flex:none;cursor:zoom-in}
  .ffig .frame{width:100%;height:auto;aspect-ratio:var(--a);border:0;overflow:hidden}
  .fcap{display:block;margin-top:.7rem;color:var(--mute)}
  .row--full{justify-content:center}
  .row--full .ffig{width:min(100cqw,calc(var(--a) * var(--maxh)))}
  .row--l{justify-content:flex-start}
  .row--r{justify-content:flex-end}
  .row--inset .ffig{width:min(62cqw,calc(var(--a) * var(--maxh)))}
  .row--narrow .ffig{width:min(38cqw,calc(var(--a) * var(--maxh)))}
  .row--narrow.row--l .ffig{margin-left:9cqw}
  .row--narrow.row--r .ffig{margin-right:9cqw}
  .row--stagger{justify-content:space-between;align-items:flex-end}
  .row--stagger .ffig{width:min(48cqw,calc(var(--a) * var(--maxh) * 1.05))}
  .row--stagger .stag--up{margin-bottom:clamp(4rem,24svh,13rem)}
  .row--duo{justify-content:space-between}
  .row--duo .ffig--big{width:min(63cqw,calc(var(--a) * var(--maxh)))}
  .row--duo .ffig--small{width:min(31cqw,calc(var(--a) * var(--maxh) * .8))}
  .duo--top{align-items:flex-start}
  .duo--bottom{align-items:flex-end}
  @media (max-width:900px){
    .free__row{display:block;margin-top:2.5rem}
    .free .ffig{width:100% !important;margin:0 0 2rem !important}
  }
  /* the full-screen viewer */
  .lightbox{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .3s ease;cursor:zoom-out}
  .lightbox.on{opacity:1}
  .lightbox__frame{position:relative;aspect-ratio:var(--a);width:min(94vw,calc(var(--a) * (100svh - 7rem)))}
  .lightbox__cap{margin-top:1rem;color:var(--mute)}

  .stage{position:relative;flex:1 1 0;min-height:0}
  .fig{
    position:absolute;margin:0;cursor:zoom-in;
    transition:left .55s cubic-bezier(.2,.7,.2,1),top .55s cubic-bezier(.2,.7,.2,1),width .55s cubic-bezier(.2,.7,.2,1),height .55s cubic-bezier(.2,.7,.2,1),opacity .4s ease;
  }
  .frame{position:relative;width:100%;height:100%;border:1px solid var(--rule);overflow:hidden}
  .stage.zoomed .fig{cursor:zoom-out}
  .stage.zoomed .fig:not(.is-zoomed){opacity:0;pointer-events:none}
  /* the horizontal gallery: only the current model is shown; the others wait out of sight either side */
  .stage--strip .fig{cursor:inherit;opacity:0;pointer-events:none}
  .stage--strip .fig.is-current{opacity:1}
  .stage--strip{cursor:zoom-in;overflow-x:clip}   /* the waiting models sit off to the side; they must not widen the page */
  .stage--strip.zoomed{cursor:zoom-out}
  .stage--strip.zoomed .fig:not(.is-zoomed){opacity:0}
  /* a note under the strip: small monospace text. It's a single element shared
     by every photo (not one per model, see layoutStrip), so it never fades in
     or out between them — it just glides to sit right under whichever model
     is current, the same fixed distance below it every time */
  .stage--strip > .note{
    position:absolute;left:50%;transform:translateX(-50%);
    width:max-content;max-width:min(64ch,90vw);
    text-align:center;
    font-family:var(--mono);font-size:.72rem;line-height:1.7;letter-spacing:.01em;
    transition:opacity .3s,top .55s cubic-bezier(.2,.7,.2,1);
  }
  .note__text{margin:0;color:var(--mute);font-size:inherit;line-height:inherit}
  .stage--strip.zoomed .note{opacity:0}
  /* visible left/right arrows to step through the models, on every device including touch.
     Positioned by JS (see layoutStrip) halfway across the empty margin beside
     the model, not flush against the edge of the stage; left/right transition
     alongside it since that margin changes with each model's own proportions */
  .strip-nav{
    display:flex;
    position:absolute;top:50%;transform:translateY(-50%);
    width:2.75rem;height:2.75rem;
    align-items:center;justify-content:center;
    background:none;border:0;padding:0;cursor:pointer;
    color:var(--mute);opacity:.55;
    transition:opacity .2s,color .2s,left .55s cubic-bezier(.2,.7,.2,1),right .55s cubic-bezier(.2,.7,.2,1);
    z-index:2;
  }
  .strip-nav:hover{opacity:1;color:var(--ink)}
  .strip-nav--left{left:0}
  .strip-nav--right{right:0}
  .strip-nav::before{
    content:"";display:block;width:.75rem;height:.75rem;
    border-right:2px solid currentColor;border-top:2px solid currentColor;
  }
  .strip-nav--left::before{transform:rotate(-135deg);margin-left:.35rem}
  .strip-nav--right::before{transform:rotate(45deg);margin-right:.35rem}
  .stage--strip.at-start .strip-nav--left,
  .stage--strip.at-end .strip-nav--right,
  .stage--strip.zoomed .strip-nav{opacity:0;pointer-events:none}
  /* the strip has its own note under the model instead — the numbered
     "n  caption" overlay is for the grid/free galleries only, and would just
     repeat "Physical models" here, maximized or not */
  .stage--strip .fig .cap{display:none}
  .fig .cap{opacity:0;transition:opacity .2s}
  .fig:hover .cap,.fig.is-zoomed .cap{opacity:1}

  /* placeholder artwork until real files are dropped in */
  .art{position:absolute;inset:0}
  .art--photo{
    background:repeating-linear-gradient(135deg,hsl(var(--h) 30% 62%) 0 6px,hsl(var(--h) 30% 68%) 6px 12px);
  }
  .art--drawing{
    background:
      linear-gradient(var(--rule) 1px,transparent 1px) 0 0/24px 24px,
      linear-gradient(90deg,var(--rule) 1px,transparent 1px) 0 0/24px 24px;
  }
  .art--drawing::before,
  .art--drawing::after{content:"";position:absolute;border:1.5px solid var(--ink);opacity:.5}
  .art--drawing::before{inset:16% 12%}
  .art--drawing::after{left:12%;top:16%;width:38%;height:36%}
  .art--physical{
    background:
      repeating-linear-gradient(120deg,transparent 0 9px,hsl(38 10% 38% / .3) 9px 10px),
      hsl(38 18% 76%);
  }

  .cap{
    position:absolute;left:.6rem;bottom:.6rem;
    padding:.25em .55em;
    background:var(--paper);
    color:var(--mute);
    max-width:calc(100% - 1.2rem);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .seg--end{display:flex;align-items:center}
  .end{
    display:block;
    width:100%;
    padding-top:1.25rem;
    border-top:1px solid var(--rule);
  }
  .end .mono{display:block;color:var(--mute)}
  .end strong{
    display:block;
    margin-top:.5rem;
    font-weight:800;
    font-size:clamp(1.6rem,4.4vw,3.4rem);
    line-height:.95;
    letter-spacing:-.04em;
    transition:color .2s;
  }
  .end:hover strong{color:var(--live)}

  /* section dots and the "keep scrolling" cue (desktop paging) */
  .dots{position:fixed;right:max(.6rem,calc(var(--pad) / 2 - 4px));top:50%;transform:translateY(-50%);z-index:15;display:flex;flex-direction:column;gap:.7rem}
  .dot{width:7px;height:7px;border:1px solid var(--mute);background:transparent;transition:background .2s,border-color .2s}
  .dot:hover{border-color:var(--live)}
  .dot.on{background:var(--ink);border-color:var(--ink)}
  .cue{position:fixed;left:0;right:0;bottom:0;z-index:15;pointer-events:none;opacity:0;transition:opacity .35s ease;text-align:center}
  .cue__label{display:block;color:var(--ink);padding-bottom:.8rem}
  .cue__bar{display:block;height:2px;background:var(--live);transform-origin:center;transform:scaleX(0)}

  footer{
    display:flex;
    justify-content:space-between;
    gap:1rem;
    padding:1.1rem var(--pad);
    font-family:var(--mono);
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--mute);
  }

  @media (max-width:900px){
    /* there's no JS paging on mobile (see project.js: pagedMQ) — a segment only needs to be exactly one
       screen tall for the desktop paging animation. Here, forcing that same fixed height while .seg--info
       centres its content meant real (tall) text overflowed the box equally above and below, landing right
       on top of the previous section. Sizing to content instead removes the overflow at its source. */
    .seg{height:auto;min-height:calc(100svh - var(--bar-h,4rem))}
    /* without desktop paging, a gallery's next section starts right where this one's own content ends —
       a little more room here means the next section's header doesn't feel like it's already crowding in
       while you're still scrolling through this one */
    .seg--gal{padding-bottom:clamp(2.5rem,10vh,4.5rem)}
    /* .intro itself was never the overlap bug — its own content already fit its box exactly — so it keeps
       the desktop behaviour untouched: a fixed-height column, the hero flexing to fill whatever space is
       left above the title, title and kicker landing at the bottom with the same spacing as desktop. That's
       also exactly "image fills the gap between the header and the title" with no separate rule needed. */
    .seg--info{align-items:flex-start;padding-block:clamp(2rem,8vh,4rem)}
    .info,.info.has-diagram{grid-template-columns:1fr;height:auto}
    .info.has-diagram > .left,.info.has-diagram .diagram{grid-column:1;align-self:auto}
    .info.has-diagram .diagram{height:22rem;margin-top:1.4rem}
    .lede,.info.has-diagram .lede{max-width:none}
    .text,.info.has-diagram .text{max-width:none}
    .info.has-diagram .credits-wrap{max-width:none}
  }
  @media (max-width:640px){
    .gv-mark{width:170px;font-size:10.5px}
    .bar{gap:1.75rem}
    .bar nav{gap:.85rem}
    /* the labelled switch is a header-bar item on desktop; on mobile it moves into the settings icon's
       popover instead, where there's room for its label and for language alongside it */
    .bar > nav > .switch{display:none}
    .settings-btn{display:flex;align-items:center;justify-content:center;padding:.3rem}
    .s8,.s6,.s4{grid-column:span 12}
    .credits div{grid-template-columns:6.5rem minmax(0,1fr)}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important}
  }
</style>
</head>

    <span class="gv-mark__line">

    </button>
    <!-- mobile only: the desktop switch above is hidden below 640px and replaced by this icon, which opens
         dark mode + language in one place instead of a bare, unlabelled toggle -->
    <button class="settings-btn" id="settingsBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"></line><circle cx="15" cy="6" r="2.1"></circle>
        <line x1="3" y1="12" x2="21" y2="12"></line><circle cx="9" cy="12" r="2.1"></circle>
        <line x1="3" y1="18" x2="21" y2="18"></line><circle cx="17" cy="18" r="2.1"></circle>
      </svg>
    </button>
    <div class="settings-panel" id="settingsPanel" hidden>
      <div class="settings-row">
        <span class="mono">Dark mode</span>
        <button class="switch theme-switch" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
          <span class="switch-track"><span class="switch-knob"></span></span>
        </button>

        <span class="mono">Language</span>

<script>
(function(){
  var switches = Array.prototype.slice.call(document.querySelectorAll('.theme-switch'));
  function isDark(){
    var a = document.documentElement.getAttribute('data-theme');
    if(a === 'dark') return true;
    if(a === 'light') return false;
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function sync(){ switches.forEach(function(b){ b.setAttribute('aria-checked', isDark() ? 'true' : 'false'); }); }
  sync();
  switches.forEach(function(b){
    b.addEventListener('click', function(){
      var next = isDark() ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try{ sessionStorage.setItem('gc-theme', next); }catch(e){}
      sync();
    });
  });

  // the site follows the system theme; the switch only overrides it for this visit
  try{
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    mq.addEventListener('change', function(){
      document.documentElement.removeAttribute('data-theme');
      try{ sessionStorage.removeItem('gc-theme'); }catch(e){}
      sync();
    });
  }catch(e){}

  // mobile-only settings popover: dark mode (above) and language, behind one icon instead of a bare toggle
  var settingsBtn = document.getElementById('settingsBtn'), settingsPanel = document.getElementById('settingsPanel');
  if(settingsBtn && settingsPanel){
    var closeSettings = function(){
      settingsPanel.classList.remove('on');
      settingsBtn.setAttribute('aria-expanded', 'false');
      setTimeout(function(){ if(!settingsPanel.classList.contains('on')) settingsPanel.hidden = true; }, 0);
    };
    settingsBtn.addEventListener('click', function(e){
      e.stopPropagation();
      if(settingsPanel.classList.contains('on')){ closeSettings(); return; }
      settingsPanel.hidden = false;
      settingsPanel.classList.add('on');
      settingsBtn.setAttribute('aria-expanded', 'true');
    });
    document.addEventListener('click', function(e){
      if(settingsPanel.classList.contains('on') && !settingsPanel.contains(e.target) && e.target !== settingsBtn) closeSettings();
    });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeSettings(); });
  }

  // language: EN / ES. Remembers the choice for next time; there is no translated copy anywhere on the
  // site yet, so for now this only changes which button is marked on — it doesn't change any page text.
  var langBtns = Array.prototype.slice.call(document.querySelectorAll('.lang-opt'));
  if(langBtns.length){
    var syncLang = function(lang){
      langBtns.forEach(function(b){ b.classList.toggle('is-on', b.getAttribute('data-lang') === lang); });
    };
    var savedLang = 'en';
    try{ savedLang = localStorage.getItem('gc-lang') || 'en'; }catch(e){}
    syncLang(savedLang);
    langBtns.forEach(function(b){
      b.addEventListener('click', function(){
        var lang = b.getAttribute('data-lang');
        syncLang(lang);
        try{ localStorage.setItem('gc-lang', lang); }catch(e){}
      });
    });
  }
})();
</script>

<script src="signature.js"></script>
