<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Gonzalo Cáceres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  try{var s=sessionStorage.getItem('gc-theme');if(s)document.documentElement.setAttribute('data-theme',s)}catch(e){}
</script>
<style>
  :root{
    --paper:#ffffff;
    --ink:#0f1216;
    --rule:#d8d6d1;
    --mute:#7b7d80;
    --live:#1a2ce0;
    --font:"Archivo","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
    --pad:clamp(1rem,4vw,2.5rem);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0d0e10;
      --ink:#f2f1ee;
      --rule:#2b2d30;
      --mute:#8b8d90;
      --live:#7d8bff;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0d0e10;
    --ink:#f2f1ee;
    --rule:#2b2d30;
    --mute:#8b8d90;
    --live:#7d8bff;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font);
    font-size:16px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit;text-decoration:none}
  button,input,textarea{font:inherit;color:inherit}
  button{background:none;border:0;padding:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--live);outline-offset:3px}

  .bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:1rem;
    padding:1.1rem var(--pad);
    font-family:var(--mono);
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .bar nav{display:flex;align-items:center;gap:1.25rem}
  .bar a:hover{color:var(--live)}
  .bar a[aria-current="page"]{color:var(--live)}

  .gv-mark{
    display:block;
    width:230px;
    font-family:'Archivo',sans-serif;
    font-weight:200;
    font-size:14px;
    color:var(--ink);
    text-decoration:none;
  }
  .gv-mark__line{display:flex;justify-content:space-between;line-height:1}
  .gv-mark__gap{flex:0 0 .8em}
  .gv-mark__line + .gv-mark__line > span:first-child{margin-left:.047em}
  .gv-mark__line + .gv-mark__line > span:last-child{margin-right:.046em}
  .gv-mark__flip{
    display:inline-block;
    transform:scaleX(-1);
    transition:transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .gv-mark:hover .gv-mark__flip,
  .gv-mark:focus-visible .gv-mark__flip{transform:scaleX(1)}

  .switch{
    display:inline-flex;
    align-items:center;
    gap:.55rem;
    font-family:var(--mono);
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .switch:hover .switch-label{color:var(--live)}
  .switch-track{
    position:relative;flex:0 0 auto;
    width:32px;height:18px;
    border-radius:6px;
    background:var(--rule);
    transition:background .25s ease;
  }
  .switch[aria-checked="true"] .switch-track{background:var(--live)}
  .switch-knob{
    position:absolute;top:2px;left:2px;
    width:14px;height:14px;
    border-radius:3px;
    background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.35),0 1px 1px rgba(0,0,0,.18);
    transition:transform .25s cubic-bezier(.2,.7,.2,1);
  }
  .switch[aria-checked="true"] .switch-knob{transform:translateX(14px)}

  /* ---------- contact ---------- */
  main{
    flex:1 0 auto;
    padding:clamp(1.5rem,6vh,4rem) var(--pad) clamp(3rem,8vh,5rem);
  }
  .mono{
    font-family:var(--mono);
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .prompt{margin:0 0 .9rem;color:var(--mute)}

  .choices{list-style:none;margin:0;padding:0}
  .choice{
    display:inline-flex;
    align-items:baseline;
    gap:1rem;
    font-family:'Archivo',sans-serif;
    font-weight:800;
    font-size:clamp(1.5rem,4.6vw,3.6rem);
    line-height:1;
    letter-spacing:-.02em;
    white-space:nowrap;
    padding:.04em 0;
    transition:letter-spacing .7s cubic-bezier(.2,.8,.2,1),color .2s;
  }
  .choice::after{
    content:"+";
    font-family:var(--mono);
    font-size:1.1rem;
    font-weight:400;
    letter-spacing:0;
    color:var(--mute);
    transition:transform .3s,color .2s;
  }
  .choice:hover,
  .choice:focus-visible,
  .choice[aria-pressed="true"]{
    letter-spacing:.07em;
    color:var(--live);
  }
  .choice:hover::after,.choice[aria-pressed="true"]::after{color:var(--live)}
  .choice[aria-pressed="true"]::after{content:"−"}
  .hint{margin:1rem 0 0;color:var(--mute);transition:opacity .3s}
  .flow.has-choice .hint{opacity:0}

  .details{
    display:grid;
    grid-template-rows:0fr;
    opacity:0;
    transition:grid-template-rows .5s cubic-bezier(.2,.7,.2,1),opacity .4s ease;
  }
  .details.open{grid-template-rows:1fr;opacity:1}
  .details > div{overflow:hidden}
  .fields{max-width:40rem;padding-top:clamp(1.8rem,5vh,3rem)}
  .field{display:block;margin-bottom:1.6rem}
  .field .mono{display:block;color:var(--mute);margin-bottom:.15rem}
  .field input,.field textarea{
    width:100%;
    background:transparent;
    border:0;
    border-bottom:1px solid var(--rule);
    border-radius:0;
    padding:.45rem 0 .55rem;
    font-weight:500;
    font-size:clamp(1.25rem,2.6vw,2rem);
    letter-spacing:-.015em;
    outline:none;
    transition:border-color .2s;
  }
  .field textarea{resize:none;min-height:5.2rem;line-height:1.3;font-family:inherit;color:inherit}
  .field input::placeholder,.field textarea::placeholder{color:var(--rule)}
  .field input:focus,.field textarea:focus{border-bottom-color:var(--live)}
  .field input[aria-invalid="true"]{border-bottom-color:#d14b4b}
  .trap{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

  .send{
    display:inline-flex;
    align-items:center;
    padding:.85rem 1.4rem;
    border:1px solid var(--ink);
    transition:color .2s,border-color .2s,background .2s,opacity .2s;
  }
  .send:hover:not(:disabled),.send:focus-visible{color:var(--live);border-color:var(--live)}
  .send:disabled{opacity:.4;cursor:default}
  /* pressing Send: the loading logo takes the place of the word, centred in the button, which keeps its size
     (the circle is drawn clockwise and the stitches appear one at a time) */
  .send{position:relative}
  .send__label{transition:opacity .2s ease}
  .send__logo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;line-height:0;color:var(--mute);transition:opacity .2s ease;pointer-events:none}
  .send__logo svg{display:block}
  .send__logo .ring{stroke:var(--mute);stroke-dasharray:100;stroke-dashoffset:0}
  .send__logo .st{stroke:currentColor;transition:opacity .25s ease}
  .send.loading .send__label{opacity:0}
  .send.loading .send__logo{opacity:1;color:var(--ink)}
  .send.loading .st{opacity:0}
  .send.loading .st.on{opacity:1}
  .send.loading:disabled{opacity:1;border-color:var(--ink)}
  .status{margin:1rem 0 0;min-height:1.2em;color:var(--mute)}
  .status.error{color:#d14b4b}

  .done{
    display:none;
    padding-top:clamp(1.2rem,3vh,2rem);
    max-width:40rem;
  }
  .done h2{margin:0;font-weight:800;font-size:clamp(1.9rem,5.4vw,4.4rem);line-height:.95;letter-spacing:-.02em}
  .done p{margin:1rem 0 0;color:var(--mute);font-size:1.05rem}
  .flow.sent .choices,.flow.sent .prompt,.flow.sent .hint,.flow.sent .details{display:none}
  .flow.sent .done{display:block}

  footer{
    display:flex;
    justify-content:space-between;
    gap:1rem;
    padding:1.1rem var(--pad);
    font-family:var(--mono);
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--mute);
  }

  @media (max-width:640px){
    .gv-mark{width:170px;font-size:10.5px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important}
  }
</style>
</head>
<body>

<header class="bar">
  <a href="/" class="gv-mark" aria-label="Gonzalo Cáceres Valcárcel — home">
    <span class="gv-mark__line">
      <span>G</span><span>O</span><span class="gv-mark__flip">N</span><span>Z</span><span>A</span><span>L</span><span>O</span>
      <span class="gv-mark__gap">&nbsp;</span>
      <span>C</span><span>Á</span><span>C</span><span>E</span><span class="gv-mark__flip">R</span><span>E</span><span>S</span>
    </span>
    <span class="gv-mark__line">
      <span>V</span><span>A</span><span class="gv-mark__flip">L</span><span>C</span><span>Á</span><span>R</span><span>C</span><span>E</span><span>L</span>
    </span>
  </a>
  <nav>
    <a href="about.html">About</a>
    <a href="contact.html" aria-current="page">Contact</a>
    <button class="switch" id="theme" role="switch" aria-checked="false" aria-label="Dark mode">
      <span class="switch-label">Dark mode</span>
      <span class="switch-track"><span class="switch-knob"></span></span>
    </button>
  </nav>
</header>

<main>
  <div class="flow" id="flow">
    <p class="prompt mono" id="prompt">Reaching out about</p>

    <ul class="choices" role="group" aria-labelledby="prompt">
      <li><button type="button" class="choice" aria-pressed="false" data-topic="Architecture">Architecture</button></li>
      <li><button type="button" class="choice" aria-pressed="false" data-topic="Development">Development</button></li>
      <li><button type="button" class="choice" aria-pressed="false" data-topic="Research">Research</button></li>
    </ul>
    <p class="hint mono">Hover, then pick one or more</p>

    <div class="details" id="details">
      <div>
        <form class="fields" id="form" novalidate>
          <label class="field">
            <span class="mono">Your name</span>
            <input type="text" name="name" id="name" autocomplete="name" placeholder="Name">
          </label>
          <label class="field">
            <span class="mono">Email or phone</span>
            <input type="text" name="contact" id="contact" autocomplete="email" placeholder="you@example.com or +1 555 000 0000">
          </label>
          <label class="field">
            <span class="mono">Message <em style="font-style:normal;opacity:.7">(optional)</em></span>
            <textarea name="message" id="message" rows="3" placeholder="Write whatever you like"></textarea>
          </label>
          <label class="trap" aria-hidden="true">Leave this empty <input type="text" name="company" id="company" tabindex="-1" autocomplete="off"></label>
          <button type="submit" class="send mono" id="send"><span class="send__label">Send</span><span class="send__logo" aria-hidden="true"><svg viewBox="0 0 200 200" width="34" height="34" fill="none">
              <circle class="ring" cx="100" cy="100" r="70" stroke-width="7" pathLength="100" transform="rotate(-90 100 100)"/>
              <g stroke-width="13">
                <path class="st" d="M120.09 60.74 L 132.29 48.54"/>
                <path class="st" d="M143.75 100 H 161"/>
                <path class="st" d="M120.09 139.26 L 132.29 151.46"/>
                <path class="st" d="M67.71 151.46 L 79.91 139.26"/>
                <path class="st" d="M42.13 108.55 A 58.5 58.5 0 0 1 42.13 91.45"/>
                <path class="st" d="M67.71 48.54 L 79.91 60.74"/>
              </g>
            </svg></span></button>
          <p class="status mono" id="status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <div class="done" id="done" role="status">
      <h2>Thank you.</h2>
      <p>I&rsquo;ll be in touch soon.</p>
    </div>
  </div>
</main>

<footer>
  <span>Architecture and development. Based in New York.</span>
  <span>&copy; 2026</span>
</footer>

<script src="contact.js"></script>
<script>
(function(){
  var btn = document.getElementById('theme');
  function isDark(){
    var a = document.documentElement.getAttribute('data-theme');
    if(a === 'dark') return true;
    if(a === 'light') return false;
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function sync(){ btn.setAttribute('aria-checked', isDark() ? 'true' : 'false'); }
  sync();
  btn.addEventListener('click', function(){
    var next = isDark() ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ sessionStorage.setItem('gc-theme', next); }catch(e){}
    sync();
  });

  // the site follows the system theme; the switch only overrides it for this visit
  try{
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    mq.addEventListener('change', function(){
      document.documentElement.removeAttribute('data-theme');
      try{ sessionStorage.removeItem('gc-theme'); }catch(e){}
      sync();
    });
  }catch(e){}
})();
</script>

<script src="signature.js"></script>
</body>
</html>
