<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gonzalo Cáceres — Architecture</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="museum.css">
<!--
  Home page trials after fernando-garrido.com, crossed with the site as it is (not linked from anywhere):
    mockups.html?v=a   Numbered index: every project at once in one numbered list (his 01..10), beside one large
                       picture that changes with the title pointed at (the live home, D, otherwise as it is)
    mockups.html?v=b   Field: all the pictures of all the work at one small height, flowing in rows like a sheet,
                       under one numbered line of the project names; pointing at either picks out that project
    mockups.html?v=c   Strip: one picture per project in one tall row, run sideways. A project opens as his project
                       pages do: its pictures first in one row at one height, then the name, the credits and the text
    mockups.html?v=c&p=<slug>  a project in C
  A and B open a project in the museum visit, as the live site does. Pictures are never cropped.
-->
<style>
  :root{
    --paper:#ffffff;
    --ink:#0f1216;
    --rule:#d8d6d1;
    --mute:#7b7d80;
    --faint:#b9bbbe;
    --plate:#f1f0ed;
    --live:var(--ink);
    --font:"Archivo","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
    --gut:clamp(1rem,4vw,2.5rem);
  }
  *{box-sizing:border-box}
  html{-webkit-tap-highlight-color:transparent}
  ::selection{background:rgba(15,18,22,.12)}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
    -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--live);outline-offset:3px}
  img{display:block}

  /* ---------- top bar and wordmark, as on the live site ---------- */
  .bar{
    display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.1rem var(--gut);
    font-family:var(--mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;
  }
  .bar nav{display:flex;align-items:center;gap:1.25rem}
  .bar a:hover{color:var(--live)}
  .gv-mark{display:block;width:230px;font-family:'Archivo',sans-serif;font-weight:300;font-size:14px;color:var(--ink);text-decoration:none;text-transform:none;letter-spacing:0}
  .gv-mark__line{display:flex;justify-content:space-between;line-height:1}
  .gv-mark__gap{flex:0 0 .8em}
  .gv-mark__line + .gv-mark__line > span:first-child{margin-left:.047em}
  .gv-mark__line + .gv-mark__line > span:last-child{margin-right:.046em}
  .gv-mark__flip{display:inline-block;transform:scaleX(-1);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .gv-mark:hover .gv-mark__flip,.gv-mark:focus-visible .gv-mark__flip{transform:scaleX(1)}

  main{flex:1;display:flex;flex-direction:column;min-height:0}
  footer{
    display:flex;flex-wrap:wrap;justify-content:space-between;gap:.4rem 1rem;padding:1.1rem var(--gut);overflow-x:clip;
    font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.03em;color:var(--mute);
  }
  .opts a{margin-left:.7rem}
  .opts a.on{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .opts a:hover{color:var(--ink)}

  /* the small things every option shares */
  .n{font-family:var(--mono);font-size:.66rem;font-weight:400;letter-spacing:.04em;color:var(--mute)}
  .k{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
  .plate{background:var(--plate);display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}

  /* =================== A: numbered index =================== */
  .a{flex:1;display:grid;grid-template-columns:minmax(15rem,21rem) 1fr;gap:clamp(1.5rem,4vw,4rem);
     padding:clamp(2rem,7vh,4.5rem) var(--gut) 0;min-height:0}
  .a-index{list-style:none;margin:0;padding:0;align-self:start}
  .a-index .grp{margin:1.6rem 0 .45rem}
  .a-index .grp:first-child{margin-top:0}
  .a-index a{display:grid;grid-template-columns:2.1rem 1fr;align-items:baseline;padding:.16rem 0;color:var(--ink);transition:color .35s ease}
  .a-index b{font-weight:800;font-size:clamp(1.15rem,1.45vw,1.4rem);letter-spacing:-.02em;line-height:1.15}
  .a-index.pointing a{color:var(--faint)}
  .a-index.pointing a .n{color:var(--faint)}
  .a-index.pointing a.cur,.a-index.pointing a.cur .n{color:var(--ink)}
  .a-stage{position:relative;min-height:0}
  /* the picture and its caption are placed by the script (see placeA), one of four ways (&img=top|block|centre|edge) */
  .a-layer{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;pointer-events:none}
  .a-layer.on{opacity:1}
  .a-fig{position:absolute;left:0;top:0;margin:0;cursor:pointer;pointer-events:none}
  .a-layer.on .a-fig{pointer-events:auto}
  .a-box img,.a-box .plate{display:block;width:100%;height:100%}
  .a-cap{display:flex;align-items:baseline;gap:1rem;padding-top:.85rem;white-space:nowrap}
  /* edge: the picture's side of the page runs to the right edge of the screen and up to the header */
  body.ai-edge .a{padding-right:0}
  body.ai-edge .a-stage{margin-top:calc(-1 * clamp(2rem,7vh,4.5rem))}
  .a-cap b{font-weight:800;font-size:clamp(1.15rem,1.5vw,1.35rem);letter-spacing:-.02em;line-height:1}

  /* =================== A, whole layouts (&l=ruler|type|label) ===================
     the numbered index and one picture per project, composed four different ways */
  .p-stage{position:relative;min-height:0}
  .p-layer{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;pointer-events:none;display:flex;align-items:flex-end;justify-content:flex-start}
  .p-layer.on{opacity:1}
  .p-layer img{max-width:100%;max-height:100%;width:auto;height:auto;cursor:pointer;pointer-events:none}
  .p-layer.on img,.p-layer.on .plate{pointer-events:auto}
  .p-layer .plate{height:100%;max-width:100%;aspect-ratio:3/2;cursor:pointer}
  .faintable a,.faintable button{transition:color .35s ease}
  .faintable.pointing .tr{color:var(--faint)}
  .faintable.pointing .tr .n,.faintable.pointing .tr .lt{color:var(--faint)}
  .faintable.pointing .tr.cur,.faintable.pointing .tr.cur .n,.faintable.pointing .tr.cur .lt{color:var(--ink)}

  /* About is not a project: it closes the index, as on the reference, in the same place as a title but light and
     grey, after a "+" instead of a number (the header has no About link in these layouts) */
  body.lay .bar nav{display:none}
  .ab{display:inline-flex;align-items:baseline;gap:.6rem;color:var(--mute);transition:color .3s}
  .ab .n{color:var(--mute)}
  .ab span:last-child{font-weight:300;letter-spacing:0}
  .ab:hover,.ab:hover .n{color:var(--ink)}

  /* ruler: the scale stands upright on the left, a thin line from top to bottom with the ten numbers spaced along
     it; the stretch of line beside the project shown darkens and its name and place appear there; the picture is
     large to its right */
  .ru{flex:1;display:grid;grid-template-columns:minmax(14rem,19rem) 1fr;gap:clamp(1.5rem,4vw,4rem);padding:clamp(1rem,3vh,2rem) var(--gut) 0;min-height:0}
  .ru .p-layer{align-items:flex-start}
  .ru-col{display:flex;flex-direction:column;min-height:0}
  .ru-scale{flex:1;display:flex;flex-direction:column;border-left:1px solid var(--rule);min-height:0}
  .ru-scale .tr{flex:1;position:relative;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;padding:.15rem 0 0 1rem;min-height:2.2rem}
  .ru-scale .tr::before{content:"";position:absolute;left:-1px;top:0;bottom:0;width:2px;background:var(--ink);transform:scaleY(0);transform-origin:top;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
  .ru-scale .tr.cur::before{transform:scaleY(1)}
  .ru-scale .tr .n{transition:color .3s}
  .ru-scale .tr:not(.cur) .n{color:var(--faint)}
  .ru-scale .tr:hover .n{color:var(--ink)}
  .ru-scale .tr b{margin-top:.3rem;font-weight:800;font-size:clamp(1.05rem,1.3vw,1.25rem);letter-spacing:-.02em;white-space:nowrap;opacity:0;transition:opacity .4s ease}
  .ru-scale .tr .k{margin-top:.2rem;white-space:nowrap;opacity:0;transition:opacity .4s ease}
  .ru-scale .tr.cur b,.ru-scale .tr.cur .k{opacity:1}
  .ru-grp{position:absolute;right:0;top:.2rem;font-family:var(--mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
  .ru-col .ab{padding:1.1rem 0 .2rem 1rem}
  .ru-col .ab span:last-child{font-size:clamp(1.05rem,1.3vw,1.25rem)}

  /* the picture side of the ruler (&img=) */
  .ru .p-stage{min-height:0}
  .ru .p-layer{background:var(--paper)}
  .rm-seq .ru-scale .tr.cur::before{transform:scaleY(var(--p,1));transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
  .rm-seq .p-layer{transition:opacity 1.1s ease;background:var(--paper)}
  .rm-strip{padding-right:0}
  .rm-strip .p-stage{overflow:hidden}
  /* the row scrolls sideways (trackpad swipe, or the wheel turned sideways by the script), no scrollbar */
  .rm-strip .p-layer{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain}
  .rm-strip .p-layer::-webkit-scrollbar{display:none}
  .rm-strip .p-layer.on{pointer-events:auto}
  .ri-row{padding-right:var(--gut)}
  .rm-strip .p-layer{bottom:2.4rem}
  .ru .ri-foot{position:absolute;left:0;right:var(--gut);top:calc(min(100% - 2.4rem, 48vh) + .9rem);padding:0;z-index:2}
  .ri-row{display:flex;gap:clamp(.9rem,1.4vw,1.4rem);height:min(100%,48vh);align-items:flex-start}
  .ri-row img,.ri-row .plate{flex:none;height:100%;width:auto;max-width:none;max-height:none;cursor:pointer}
  .ri-row .plate{aspect-ratio:3/2}
  .ri-sheet{display:flex;flex-wrap:wrap;align-content:flex-start;gap:14px;width:100%}
  .ri-sheet img{height:var(--sh,180px);width:auto;max-width:none;max-height:none;cursor:pointer}
  .ri-sheet .plate{height:var(--sh,180px);aspect-ratio:3/2}
  .rm-thumbs .p-layer{flex-direction:column;align-items:flex-start;justify-content:flex-start}
  .ri-big{flex:1;min-height:0;width:100%;display:flex;align-items:flex-start}
  .ri-big img{max-width:100%;max-height:100%}
  .ri-big .plate{height:100%}
  .ri-tn{display:flex;gap:.6rem;margin-top:1.1rem;height:3.4rem;flex:none;max-width:100%;overflow:hidden}
  .ri-tn button{height:100%;opacity:.32;transition:opacity .3s ease}
  .ri-tn button.on,.ri-tn button:hover{opacity:1}
  .ri-tn button img{height:100%;width:auto;max-width:none;max-height:none;pointer-events:auto}
  /* parts of a project (cluster, drift, living) */
  @keyframes riIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .ri-more{position:absolute;right:0;bottom:0;color:var(--mute)}
  .rm-cluster .ri-more{opacity:0}
  .rm-cluster .p-layer.on .ri-more{animation:riIn .9s ease forwards}
  .rm-cluster .p-layer{display:block}
  .ri-slot{position:absolute;opacity:0}
  .p-layer.on .ri-slot{animation:riIn .9s cubic-bezier(.2,.7,.2,1) forwards}
  .ri-slot img{width:100%;height:100%;max-width:none;max-height:none}
  .ri-slot .plate{width:100%;height:auto}
  .rm-drift{padding-right:0}
  .rm-drift .p-stage{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent)}
  .ri-drift{display:flex;gap:clamp(1.2rem,2vw,2rem);height:min(100%,50vh);align-items:flex-start;will-change:transform}
  .ri-drift img,.ri-drift .plate{flex:none;height:100%;width:auto;max-width:none;max-height:none}
  .ri-drift .plate{aspect-ratio:3/2}
  .ri-living{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:1fr .8fr;gap:16px;width:100%;height:calc(100% - 2rem)}
  .ri-cell{position:relative;min-height:0;opacity:0}
  .p-layer.on .ri-cell{animation:riIn .9s cubic-bezier(.2,.7,.2,1) forwards}
  .ri-cell img,.ri-cell .plate{position:absolute;left:0;top:0;max-width:100%;max-height:100%;width:auto;height:auto;transition:opacity .9s ease}
  .ri-cell img.ri-new{opacity:0;animation:riFade .9s ease forwards}
  .ri-cell img.ri-out{opacity:0}
  @keyframes riFade{to{opacity:1}}
  /* type: only the names, in one quiet column; nothing else on the page until you point at one, then the others
     go pale and its picture appears in the space to the right, top on that name's line */
  .ty{flex:1;position:relative;padding:clamp(2rem,9vh,6rem) var(--gut) 1rem;min-height:0}
  .ty-list{list-style:none;margin:0;padding:0;position:relative;z-index:1}
  .ty-list .tr{display:inline-flex;align-items:baseline;gap:.7rem;padding:0;text-align:left}
  .ty-list b{font-weight:800;font-size:clamp(1.5rem,3.7vh,2.3rem);letter-spacing:-.03em;line-height:1.22}
  .ty-list .ab{margin-top:1.6rem}
  .ty-list .ab span:last-child{font-size:clamp(1.5rem,3.7vh,2.3rem);letter-spacing:-.02em}
  .ty .p-stage{position:absolute;left:0;top:0;width:0;height:0}
  .ty .p-layer{inset:auto;left:0;top:0;width:var(--pw,40vw);height:var(--ph,40vh);align-items:flex-start;transition:opacity .5s ease}

  /* label: the picture hangs on the wall and the label sits beside it, as in a museum: picture and label share
     one floor line, the picture pushed up against the label; the label holds the name, place and year of the
     picture, then the numbered list, small */
  .lb{flex:1;display:grid;grid-template-columns:1fr minmax(13rem,15rem);gap:clamp(1.5rem,2.5vw,2.5rem);padding:clamp(1rem,3vh,2rem) var(--gut) 1.4rem;min-height:0}
  .lb .p-stage{height:100%}
  .lb .p-layer{justify-content:flex-end;align-items:flex-end}
  .lb-label{align-self:end}
  .lb-now{margin-bottom:2.2rem}
  .lb-now h2{margin:0;font-weight:800;font-size:1.3rem;letter-spacing:-.02em;line-height:1.15}
  .lb-now .k{display:block;margin-top:.4rem}
  .lb-list{list-style:none;margin:0;padding:0}
  .lb-list .tr{display:grid;grid-template-columns:1.7rem 1fr;align-items:baseline;padding:.05rem 0;text-align:left;width:100%}
  .lb-list .tr .lt{font-weight:400;font-size:.86rem}
  .lb-list .ab{display:grid;grid-template-columns:1.7rem 1fr;gap:0;margin-top:.9rem}
  .lb-list .ab span:last-child{font-size:.86rem}

  /* =================== a project, in the ruler's language =================== */
  .rp{flex:1;display:grid;grid-template-columns:minmax(14rem,19rem) 1fr;gap:clamp(1.5rem,4vw,4rem);padding:clamp(1rem,3vh,2rem) var(--gut) 0;min-height:0}
  .rp-col{position:relative;display:flex;flex-direction:column;min-height:0;padding-left:1rem}
  .rp-step .rp-col{overflow-y:auto;scrollbar-width:none}
  .rp-step .rp-col::-webkit-scrollbar{display:none}
  .rp-scroll .rp-col{position:sticky;top:1.5rem;height:calc(100vh - 8.5rem);align-self:start;overflow-y:auto;scrollbar-width:none}
  .rp-scroll .rp-col::-webkit-scrollbar{display:none}
  .rp-line{position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--rule)}
  .rp-mark{position:absolute;left:-.5px;width:2px;background:var(--ink);top:0;height:0;transition:top .7s cubic-bezier(.2,.7,.2,1),height .7s cubic-bezier(.2,.7,.2,1)}
  .rp-scroll .rp-mark{transition:none}
  .rp-hit{position:absolute;left:-7px;width:15px}
  .rp-label h1{display:flex;flex-direction:column;gap:.35rem;margin:.1rem 0 0;font-weight:800;font-size:clamp(1.3rem,1.7vw,1.6rem);letter-spacing:-.025em;line-height:1.1}
  .rp-label > .k{margin:.45rem 0 1.4rem}
  .rp-cr p{margin:0 0 .2rem;font-weight:300;font-size:.86rem}
  .rp-cr b{font-weight:800}
  .rp-text{margin-top:1.4rem}
  .rp-text p{margin:0 0 .9rem;font-weight:300;font-size:.92rem;line-height:1.55}
  .rp-text p.lede{font-weight:400;font-size:1rem;line-height:1.45}
  .rp-text p.extra{display:none}
  .rp-col.open .rp-text p.extra{display:block}
  .rp-more{font-family:var(--mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;align-self:flex-start}
  .rp-more:hover{text-decoration:underline;text-underline-offset:3px}
  .rp-nk{margin-top:auto;padding-top:1.5rem;color:var(--faint)}
  .rp-next{padding-top:.3rem}
  .rp-next span:last-child{font-size:clamp(1.05rem,1.3vw,1.25rem)}
  .rp-stage{min-height:0}
  .rp-stage .p-layer{background:var(--paper);align-items:flex-start;transition:opacity 1.1s ease}
  .rp-one{margin:0;display:flex;flex-direction:column;align-items:flex-start;max-width:100%;max-height:100%;height:100%}
  .rp-one img{max-width:100%;max-height:calc(100% - 2.2rem);width:auto;height:auto;cursor:pointer;pointer-events:auto}
  .rp-one .plate{height:calc(100% - 2.2rem);aspect-ratio:3/2;max-width:100%}
  .rp-one figcaption{margin-top:.7rem}
  /* scroll: the pictures laid out loosely on a 12-column field, each at its own size and place (whole, never cut),
     sometimes two side by side at different heights; each comes in as it reaches the screen */
  .rp-flow{padding-bottom:30vh;min-width:0}
  .rp-row{display:grid;grid-template-columns:repeat(12,1fr);column-gap:clamp(1rem,2vw,2rem);align-items:start}
  .rp-fig{margin:0;min-width:0}
  .rp-fig img{display:block;width:100%;height:auto;cursor:zoom-in}
  .rp-fig figcaption{margin-top:.7rem}
  .rp-fig .plate{width:100%;aspect-ratio:3/2}
  .rp-par{will-change:transform}
  /* how they come in: rise (fade up), unveil (drawn open from the bottom edge), drift (rise, then each moves at its own
     pace as the page scrolls) */
  .rp-fig{opacity:0;transform:translateY(9vh);transition:opacity 1.3s ease,transform 1.6s cubic-bezier(.16,.8,.2,1)}
  .rp-fig.in{opacity:1;transform:none}
  .in-unveil .rp-fig{opacity:1;transform:translateY(3vh)}
  .in-unveil .rp-fig img,.in-unveil .rp-fig .plate{clip-path:inset(100% 0 0 0);transition:clip-path 1.5s cubic-bezier(.7,0,.2,1)}
  .in-unveil .rp-fig.in{transform:none}
  .in-unveil .rp-fig.in img,.in-unveil .rp-fig.in .plate{clip-path:inset(0 0 0 0)}
  .in-unveil .rp-fig figcaption{opacity:0;transition:opacity .8s ease 1.1s}
  .in-unveil .rp-fig.in figcaption{opacity:1}
  /* =================== B: field =================== */
  .b-line{display:flex;flex-wrap:wrap;gap:.35rem 1.7rem;padding:clamp(1.6rem,5vh,3rem) var(--gut) 0;max-width:72rem}
  .b-line a{display:inline-flex;align-items:baseline;gap:.45rem;transition:color .3s ease}
  .b-line b{font-weight:800;font-size:clamp(1rem,1.2vw,1.15rem);letter-spacing:-.015em}
  .b-line a.empty{color:var(--faint)}
  .b-line a.empty .n{color:var(--faint)}
  body.pointing .b-line a{color:var(--faint)}
  body.pointing .b-line a .n{color:var(--faint)}
  body.pointing .b-line a.cur,body.pointing .b-line a.cur .n{color:var(--ink)}
  .b-field{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2.6rem 1.6rem;padding:clamp(2rem,6vh,3.5rem) var(--gut) 3rem}
  .b-pic{display:block;height:clamp(140px,23vh,250px);transition:opacity .45s ease}
  .b-pic img{height:100%;width:auto}
  body.pointing .b-pic{opacity:.14}
  body.pointing .b-pic.cur{opacity:1}

  /* =================== C: strip =================== */
  .c-strip{display:flex;align-items:flex-end;gap:clamp(1.2rem,2.2vw,2.2rem);overflow-x:auto;overflow-y:hidden;
    padding:0 var(--gut);scrollbar-width:none;overscroll-behavior-x:contain}
  .c-strip::-webkit-scrollbar{display:none}
  .c-item{flex:0 0 auto;margin:0;cursor:pointer}
  .c-item .c-box{height:var(--h);display:flex;align-items:flex-end}
  .c-item img{height:100%;width:auto}
  .c-item .plate{height:100%;aspect-ratio:3/2}
  .c-item figcaption{display:flex;align-items:baseline;gap:.7rem;padding-top:.9rem;height:3.2rem;white-space:nowrap}
  .c-item figcaption b{font-weight:800;font-size:clamp(1.05rem,1.3vw,1.25rem);letter-spacing:-.02em}
  .c-home{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:1.2rem;--h:clamp(260px,46vh,520px)}
  .c-foot{display:flex;align-items:center;gap:1rem;padding:.4rem var(--gut) 0}
  .c-rail{position:relative;flex:1;height:1px;background:var(--rule)}

  }

<script>
(function(){
  var P = window.PROJECTS || {}, SLUGS = Object.keys(P);
  var Q = new URLSearchParams(location.search);
  var V = (Q.get('v') || 'a').toLowerCase(); if(!/^[abc]$/.test(V)) V = 'a';
  var PAGE = V === 'c' && P[Q.get('p')] ? Q.get('p') : null;
  var main = document.getElementById('main');
  document.body.classList.add('v-' + V);
  document.querySelectorAll('.opts a').forEach(function(a){ a.classList.toggle('on', a.getAttribute('data-v') === V); });
  document.getElementById('home').setAttribute('href', '?v=' + V);

  // ---- the project material, the same way the museum visit reads it ----
  function web(src){
    if(src === 'img/anticlastic-roof-structure/hero.jpg') return 'img/anticlastic-roof-structure/hero-web.jpg';
    return src.replace(/\/physical\/(?!web\/)([^\/]+)$/, '/physical/web/$1');
  }
  // the small copy next to a photo (tools/thumbs.sh); drawings are already light
  function thumb(src){ return /\.jpe?g$/i.test(src) ? src.replace(/\/physical\/web\//, '/physical/').replace(/\/([^\/]+)\.jpe?g$/i, '/thumbs/$1.jpg') : src; }
  function isDrawing(it){ return it.drawing || /\.(svg|png|webp)$/i.test(it.src); }
  function flat(list){ var o = []; (list || []).forEach(function(it){ Array.isArray(it) ? o.push.apply(o, it) : o.push(it); }); return o; }
  function pictures(slug){
    var p = P[slug], grid = flat(p.grid), g = p.gallery || {}, seen = {}, out = [];
    var drawings = grid.filter(isDrawing), physical = grid.filter(function(it){ return !isDrawing(it) && /\/physical\//.test(it.src); });
    var photos = grid.filter(function(it){ return !isDrawing(it) && !/\/physical\//.test(it.src); });
    if(!grid.length){ drawings = g.drawings || []; physical = g.physical || []; photos = g.photos || []; }
    if(!physical.length && g.physical) physical = g.physical;
    [p.hero ? [{src: p.hero}] : [], p.diagram && p.diagram.src ? [{src: p.diagram.src, caption: p.diagram.caption, drawing: true}] : [], drawings, physical, photos].forEach(function(list){
      list.forEach(function(it){
        var s = it.src && web(it.src);
        if(!s || seen[s]) return; seen[s] = 1;
        var dr = isDrawing(it);
        out.push({src: s, drawing: dr, kind: dr ? 'drawing' : /\/physical\//.test(s) ? 'physical' : 'photo', caption: it.caption || ''});
      });
    });
    return out;
  }
  function coverOf(slug){ var p = P[slug], all = pictures(slug); return all.length ? (p.cover ? {src: p.cover} : all[0]) : null; }
  function el(tag, cls, parent, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; if(parent) parent.appendChild(e); return e; }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function num(slug){ return pad(SLUGS.indexOf(slug) + 1); }
  function visit(slug, from, src){
    // on the ruler home, a project opens as its own ruled page (the mockup), not the museum visit
    if(document.body.classList.contains('l-ruler')){ location.href = '?v=a&l=ruler&p=' + slug; return; }
    if(window.gcMuseum) gcMuseum.open(slug, from && from.getBoundingClientRect(), src);
    else location.href = '/?visit=' + slug;
  }

  // =================== A: numbered index ===================
  function buildA(){
    var wrap = el('div', 'a', main), list = el('ol', 'a-index', wrap), stage = el('div', 'a-stage', wrap);
    var links = [], group = null;
    SLUGS.forEach(function(slug){
      var p = P[slug];
      if(p.group !== group){ group = p.group; el('li', 'grp k', list, group); }
      var li = el('li', '', list), a = el('a', '', li);
      a.href = '/?visit=' + slug; a.slug = slug;
      el('span', 'n', a, num(slug)); el('b', '', a, p.title);
      links.push(a);
    });
    var layers = [0, 1].map(function(){
      var L = el('div', 'a-layer', stage);
      L.fig = el('figure', 'a-fig', L);
      L.box = el('div', 'a-box', L.fig); L.cap = el('figcaption', 'a-cap', L.fig);
      L.t = el('b', '', L.cap); L.k = el('span', 'k', L.cap);
      L.fig.addEventListener('click', function(){ if(L.slug) visit(L.slug, L.box.firstChild, L.src); });
      return L;
    });
    // where the picture sits beside the list, whole, at its own proportions:
    //   top    its top on the list's first line, as wide as the space allows, caption under it
    //   block  exactly as tall as the list, top and bottom on the list's first and last lines: one block with it
    //   centre in the middle of the space, smaller, like a picture hung on an empty wall
    //   edge   as large as the space allows up to the screen's right edge and the header, against that corner
    var IMG = (Q.get('img') || 'top').toLowerCase();
    if(['top', 'block', 'centre', 'edge'].indexOf(IMG) === -1) IMG = 'top';
    document.body.classList.add('ai-' + IMG);
    // mockup only: the four ways, next to the A / B / C switch
    var opts = document.querySelector('.opts');
    opts.insertBefore(document.createTextNode('Picture'), opts.firstChild);
    ['top', 'block', 'centre', 'edge'].forEach(function(m, i){
      var a = document.createElement('a'); a.href = '?v=a&img=' + m; a.textContent = m; a.className = m === IMG ? 'on' : '';
      opts.insertBefore(a, opts.childNodes[i + 1]);
    });
    opts.insertBefore(document.createTextNode('\u2003Mockup'), opts.childNodes[5]);
    opts.removeChild(opts.childNodes[6]);
    function fit(a, w, h){ return w / h > a ? {w: h * a, h: h} : {w: w, h: w / a}; }
    function place(L){
      if(!L.ratio) return;
      var W = stage.clientWidth, H = stage.clientHeight, cap = 52, phone = innerWidth <= 900, mode = phone ? 'top' : IMG;
      var sr = stage.getBoundingClientRect(), lr = list.getBoundingClientRect();
      var lt = lr.top - sr.top, lh = lr.height, x = 0, y = 0, r;
      if(mode === 'top'){ r = fit(L.ratio, W, H - cap); }
      else if(mode === 'block'){ y = Math.max(0, lt); r = fit(L.ratio, W, Math.min(lh, H - cap - y)); }
      else if(mode === 'centre'){ r = fit(L.ratio, W * .72, (H - cap) * .72); x = (W - r.w) / 2; y = (H - cap - r.h) / 2; }
      else { r = fit(L.ratio, W, H - cap); x = W - r.w; }
      L.box.style.width = r.w + 'px'; L.box.style.height = r.h + 'px';
      L.fig.style.left = x + 'px'; L.fig.style.top = y + 'px';
    }
    addEventListener('resize', function(){ layers.forEach(place); });
    var cur = null, timer = null;
    function show(slug, instant){
      if(slug === cur) return;
      cur = slug;
      links.forEach(function(a){ a.classList.toggle('cur', a.slug === slug); });
      var on = layers[0].classList.contains('on') ? layers[0] : layers[1];
      var L = instant ? on : (on === layers[0] ? layers[1] : layers[0]);
      var c = coverOf(slug), p = P[slug];
      L.slug = slug; L.src = c && c.src; L.box.innerHTML = ''; L.ratio = 0;

    for(var k = 0; k < n; k++){ (function(k){ var b = el('button', 'rp-hit', line); b.type = 'button'; b.style.top = (k / n * 100) + '%'; b.style.height = (100 / n) + '%'; b.setAttribute('aria-label', 'Picture ' + (k + 1)); b.addEventListener('click', function(){ go(k); }); })(k); }

      if(on === isOpen()) return;
      st.style.setProperty('--ny', nameY() + 'px');
      if(D !== 'fold'){ wrap.classList.toggle('open', on); return; }
      // fold: the picture closes into its middle line, the line rises to the name, the words come in under it and the
      // picture opens again beside them, out of a line; closing just lets the words go and the picture slide back
      T.forEach(clearTimeout); T = [];
      if(!on){
        wrap.classList.remove('shown', 'open'); rule.style.opacity = '0';
        st.querySelectorAll('.p-layer').forEach(function(L){ L.style.transition = 'opacity 1.1s ease, left .6s cubic-bezier(.2,.7,.2,1)'; });
        T.push(setTimeout(function(){ st.querySelectorAll('.p-layer').forEach(function(L){ L.style.transition = ''; }); }, 700));
        return;
      }
      var im = curImg(), sr = st.getBoundingClientRect(), r = im ? im.getBoundingClientRect() : sr;
      function put(o){ rule.style.top = o.top; rule.style.left = o.left; rule.style.width = o.width; }
      wrap.classList.add('open');
      rule.style.transition = 'none'; put({top: (r.top - sr.top + r.height / 2) + 'px', left: (r.left - sr.left) + 'px', width: r.width + 'px'});
      void rule.offsetWidth; rule.style.transition = ''; rule.style.opacity = '1';
      if(im) im.style.clipPath = 'inset(50% 0 50% 0)';
      T.push(setTimeout(function(){ put({top: nameY() + 'px', left: '0px', width: Math.min(sr.width, card.offsetWidth || 336) + 'px'}); }, 380));
      T.push(setTimeout(function(){
        wrap.classList.add('shown');
        if(im){ void im.offsetWidth; im.style.clipPath = 'inset(0 0 0 0)'; T.push(setTimeout(function(){ im.style.clipPath = ''; }, 450)); }
      }, 760));
    }
    plus.addEventListener('click', function(e){ e.stopPropagation(); toggle(); });
    card.addEventListener('click', function(e){ e.stopPropagation(); });
    var at = -1, lock = 0;
    function go(k){
      if(k >= n){ location.href = quietHref(nx); return; }
      if(k < 0){ location.href = quietHref(pv, 'last'); return; }
      if(k === at) return;
      var first = at < 0; at = k;
      fade(function(L){
        var it = all[k];
        if(it){ var im = el('img', '', L); im.alt = it.caption || p.title; im.src = it.src; }
        else el('div', 'plate', L, 'In preparation');
      }, first);
      dots.forEach(function(d, j){ d.classList.toggle('cur', j === k); });
    }
    st.addEventListener('mousemove', function(e){ var r = st.getBoundingClientRect(); st.classList.toggle('back', e.clientX < r.left + r.width * .35); });
    st.addEventListener('click', function(e){
      if(isOpen() && D === 'float'){ toggle(false); return; }
      var r = st.getBoundingClientRect(); go(at + (e.clientX < r.left + r.width * .35 ? -1 : 1));
    });
    addEventListener('wheel', function(e){
      if(card.contains(e.target) && card.scrollHeight > card.clientHeight) return;
      var d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
      if(Math.abs(d) < 8) return;
      e.preventDefault();
      var now = Date.now(); if(now - lock < 750) return; lock = now;
      go(at + (d > 0 ? 1 : -1));
    }, {passive: false});
    addEventListener('keydown', function(e){
      if(e.key === 'ArrowDown' || e.key === 'ArrowRight'){ go(at + 1); e.preventDefault(); }
      if(e.key === 'ArrowUp' || e.key === 'ArrowLeft'){ go(at - 1); e.preventDefault(); }
      if(e.key === 'Escape'){ if(isOpen()) toggle(false); else location.href = '?v=a&l=quiet'; }
    });
    var sx = null;
    st.addEventListener('touchstart', function(e){ sx = e.touches[0].clientX; }, {passive: true});
    st.addEventListener('touchend', function(e){ if(sx == null) return; var dx = e.changedTouches[0].clientX - sx; sx = null; if(Math.abs(dx) > 40) go(at + (dx < 0 ? 1 : -1)); }, {passive: true});
    var start = Q.get('i'); go(start === 'last' ? n - 1 : Math.max(0, Math.min(n - 1, (parseInt(start, 10) || 1) - 1)));
  }

  // the intro, for quiet. The old one (the name large in the middle, its letters flipping in like an airport board, then
  // gliding to the header) is replaced by something quieter. He kept line (2026-10-26); marks stays reachable by address:
  //   line   one thin line draws across where the picture will be; the picture opens up and down out of it while the
  //          marks draw in one by one; then the name
  //   marks  an empty page; the ten marks draw in one by one, top to bottom; then the name; then the picture
  // Once per visit (as the live site does); a link in the footer plays it again.
  function quietIntro(home){
    var kind = (Q.get('intro') || 'line').toLowerCase();
    if(kind === 'off' || kind === 'none') return;
    if(kind !== 'marks') kind = 'line';
    var forced = Q.has('intro');
    try{ if(!forced && sessionStorage.getItem('gc-qintro') === '1') return; sessionStorage.setItem('gc-qintro', '1'); }catch(e){}
    if(matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var b = document.body, marks = Array.prototype.slice.call(document.querySelectorAll('.qt-ticks > .qk')), st = document.querySelector('.qt-stage');
    var T = [];
    function later(fn, ms){ T.push(setTimeout(fn, ms)); }
    b.classList.add('qi', 'qi-' + kind);
    marks.forEach(function(m, i){ m.style.setProperty('--d', (i * 70) + 'ms'); });
    function img(){ return st.querySelector('.p-layer.on img, .p-layer.on .plate'); }
    function end(){
      b.classList.remove('qi', 'qi-' + kind, 'qi-marks-in', 'qi-name-in', 'qi-pic-in', 'qi-line-in', 'qi-open');
      marks.forEach(function(m){ m.style.removeProperty('--d'); });
      var im = img(); if(im) im.style.clipPath = '';
      var ln = document.querySelector('.qi-rule'); if(ln) ln.remove();
      home.restart();
    }
    if(kind === 'marks'){
      later(function(){ b.classList.add('qi-marks-in'); }, 150);
      later(function(){ b.classList.add('qi-name-in'); }, 1000);
      later(function(){ b.classList.add('qi-pic-in'); }, 1400);
      later(end, 2700);
      return;
    }
    // line: wait for the first picture to know its size (never long)
    var started = false;
    function go(){
      if(started) return; started = true;
      var im = img(), sr = st.getBoundingClientRect(), r = im ? im.getBoundingClientRect() : sr;
      var ln = el('div', 'qi-rule', st);
      ln.style.left = (r.left - sr.left) + 'px'; ln.style.width = r.width + 'px'; ln.style.top = (r.top - sr.top + r.height / 2) + 'px';
      if(im){ im.style.transition = 'none'; im.style.clipPath = 'inset(50% 0 50% 0)'; }
      b.classList.add('qi-pic-in');
      later(function(){ b.classList.add('qi-line-in'); }, 80);
      later(function(){
        if(im){ im.style.transition = 'clip-path 1.25s cubic-bezier(.7,0,.2,1)'; im.style.clipPath = 'inset(0 0 0 0)'; }
        b.classList.add('qi-open', 'qi-marks-in');
      }, 1000);
      later(function(){ b.classList.add('qi-name-in'); }, 1900);
      later(function(){ if(im) im.style.transition = ''; end(); }, 3000);
    }
    var im0 = img();
    if(im0 && im0.tagName === 'IMG' && !im0.complete){ im0.addEventListener('load', go); setTimeout(go, 1200); }
    else setTimeout(go, 30);
  }

  var LAY = (Q.get('l') || '').toLowerCase(), LAYS = {ruler: buildRuler, type: buildType, label: buildLabel, quiet: buildQuiet};
  if(V === 'a' && LAYS[LAY]){
    document.body.classList.add('l-' + LAY, 'lay');
    var lo = document.querySelector('.opts');
    lo.innerHTML = 'Layout' + Object.keys(LAYS).map(function(k){ return '<a href="?v=a&l=' + k + '"' + (k === LAY ? ' class="on"' : '') + '>' + k + '</a>'; }).join('');
    var RP = LAY === 'ruler' && P[Q.get('p')] ? Q.get('p') : null;
    if(LAY === 'ruler') document.getElementById('home').setAttribute('href', '?v=a&l=ruler');
    if(LAY === 'quiet'){
      document.getElementById('home').setAttribute('href', '?v=a&l=quiet');
      lo.innerHTML = (P[Q.get('p')] ? '' : '<a href="?v=a&l=quiet&intro=line">replay intro</a><span style="margin-right:1.2rem"></span>') + '<a href="draft-ruler.html?v=a&l=ruler">ruler draft</a><span style="margin-left:1.2rem;color:var(--faint)">q6</span>';
      if(P[Q.get('p')]) buildQuietProject(Q.get('p')); else quietIntro(buildQuiet());
      RP = null; LAY = '';
    }
    if(RP) lo.innerHTML = 'Project' + ['step', 'scroll'].map(function(k){ return '<a href="?v=a&l=ruler&p=' + RP + '&pv=' + k + '"' + (k === PV ? ' class="on"' : '') + '>' + k + '</a>'; }).join('') + (PV === 'scroll' ? '<span style="margin-left:1.2rem">Appear</span>' + ['rise', 'unveil', 'drift'].map(function(k){ var cur = (Q.get('in') || 'rise').toLowerCase(); return '<a href="?v=a&l=ruler&p=' + RP + '&pv=scroll&in=' + k + '"' + (k === cur ? ' class="on"' : '') + '>' + k + '</a>'; }).join('') : '') + '<span style="margin-left:1.2rem;color:var(--faint)">r12</span>';
    else if(LAY === 'ruler') lo.innerHTML = '<span style="color:var(--faint)">r12</span>';
    if(RP){ document.body.classList.add('rp-page'); buildRuledProject(RP); }
    else if(LAYS[LAY]) LAYS[LAY]();
  }
  else if(V === 'a') buildA();
  else if(V === 'b') buildB();
  else if(PAGE) buildProject(PAGE);
  else buildC();
})();
</script>
