<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project — Gonzalo Cáceres</title>
<!-- Layout test: a single-scroll project page modelled on oma.com/projects/astor-place-hotel
     (full-bleed hero, narrow centred text with "Read more", a ruled facts table, then a wider image
     column: full-width images and a 3-column grid of tiles). Reads the same entry from projects.js as
     project.html, so it is a copy of a project's page, not of its content. Open with ?p=<slug>. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  try{var s=sessionStorage.getItem('gc-theme');if(s)document.documentElement.setAttribute('data-theme',s)}catch(e){}
</script>
<script src="embed.js"></script>
<style>
  :root{
    --paper:#ffffff;
    --ink:#0f1216;
    --rule:#d8d6d1;
    --mute:#7b7d80;
    --live:#1a2ce0;
    --font:"Archivo","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
    --pad:clamp(1rem,4vw,2.5rem);
    --g:clamp(.75rem,1.5vw,1.5rem);   /* gap between images */
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0d0e10;
      --ink:#f2f1ee;
      --rule:#2b2d30;
      --mute:#8b8d90;
      --live:#7d8bff;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0d0e10;
    --ink:#f2f1ee;
    --rule:#2b2d30;
    --mute:#8b8d90;
    --live:#7d8bff;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font);
    font-size:16px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--live);outline-offset:3px}
  .mono{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}

  /* ---------- top bar (same as project.html) ---------- */
  .bar{
    position:sticky;top:0;z-index:20;
    background:var(--paper);
    display:flex;justify-content:space-between;align-items:center;gap:1rem;
    padding:1.1rem var(--pad);
    font-family:var(--mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;
  }
  .bar nav{position:relative;display:flex;align-items:center;gap:1.25rem}
  .bar a:hover{color:var(--live)}
  .settings-btn{display:none;color:var(--ink)}
  .settings-btn svg circle{fill:var(--paper)}
  .settings-panel{
    display:none;position:absolute;right:0;top:calc(100% + .7rem);min-width:11rem;
    background:var(--paper);border:1px solid var(--rule);padding:.9rem 1rem;z-index:30;
    box-shadow:0 10px 28px rgba(0,0,0,.14);
  }
  .settings-panel.on{display:block}
  .settings-row{display:flex;align-items:center;justify-content:space-between;gap:1.25rem}
  .settings-row + .settings-row{margin-top:.85rem}
  .lang-toggle{display:flex;border:1px solid var(--rule)}
  .lang-opt{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;padding:.3rem .6rem;color:var(--mute);transition:background .2s,color .2s}
  .lang-opt.is-on{background:var(--ink);color:var(--paper)}
  .ptitle{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,calc(-50% + 4px));
    max-width:34vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-family:var(--font);font-weight:800;font-size:.997rem;line-height:1.4;letter-spacing:-.01em;text-transform:none;
    color:var(--ink);opacity:0;pointer-events:none;
    transition:opacity .35s ease,transform .35s cubic-bezier(.2,.7,.2,1),color .2s;
  }
  .ptitle.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
  .ptitle:hover{color:var(--live)}
  @media (max-width:900px){.ptitle{display:none}}

  .gv-mark{display:block;width:230px;font-family:'Archivo',sans-serif;font-weight:300;font-size:14px;color:var(--ink);text-decoration:none}
  .gv-mark__line{display:flex;justify-content:space-between;line-height:1}
  .gv-mark__gap{flex:0 0 .8em}
  .gv-mark__line + .gv-mark__line > span:first-child{margin-left:.047em}
  .gv-mark__line + .gv-mark__line > span:last-child{margin-right:.046em}
  .gv-mark__flip{display:inline-block;transform:scaleX(-1);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .gv-mark:hover .gv-mark__flip,.gv-mark:focus-visible .gv-mark__flip{transform:scaleX(1)}

  .switch{display:inline-flex;align-items:center;gap:.55rem;font-family:var(--mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
  .switch:hover .switch-label{color:var(--live)}
  .switch-track{position:relative;flex:0 0 auto;width:32px;height:18px;border-radius:6px;background:var(--rule);transition:background .25s ease}
  .switch[aria-checked="true"] .switch-track{background:var(--live)}
  .switch-knob{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:3px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35),0 1px 1px rgba(0,0,0,.18);transition:transform .25s cubic-bezier(.2,.7,.2,1)}
  .switch[aria-checked="true"] .switch-knob{transform:translateX(14px)}

  /* ---------- the page: hero, text column, facts, images ---------- */
  /* Everything below the bar is sized in a unit (--u, the em of <main>) that steps up with the window
     the way oma.com's root font size does: 15px on a phone, 14px from 768, then 16 / 18 / 24 / 32px at
     1300 / 1600 / 1799 / 2399. Between steps the column keeps its width and the side margins grow; at
     each step the whole page grows, so on a big screen it is the same page, larger, not a wider one. */
  :root{--u:15px}
  @media (min-width:768px){:root{--u:14px}}
  @media (min-width:1300px){:root{--u:16px}}
  @media (min-width:1600px){:root{--u:18px}}
  @media (min-width:1799px){:root{--u:24px}}
  @media (min-width:2399px){:root{--u:32px}}
  main{font-size:var(--u)}

  /* the hero runs edge to edge at the picture's own proportions (no crop); the title starts below it */
  .o-hero{margin:0;aspect-ratio:3/2;background:var(--rule)}
  .o-hero img{display:block;width:100%;height:100%;object-fit:cover}

  /* one centred column, 59.375em wide (831px at 14px) with at least 1em each side; the text sits in its
     middle ten twelfths (OMA's 12-column grid), the images use all of it */
  .col{width:calc(min(100% - 2em, 59.375em) * .8294);margin-inline:auto}
  .col--wide{width:min(100% - 2em, 59.375em)}

  .o-head{padding-top:3em}
  .o-title{margin:0;font-weight:800;font-size:2.375em;line-height:1.05;letter-spacing:-.02em}
  .o-lede{margin:1.5em 0 0;font-weight:500;font-size:1.375em;line-height:1.4;letter-spacing:-.01em}
  .o-text{margin:1em 0 0;font-size:1.1875em;line-height:1.5}
  .o-more{overflow:hidden;transition:height .45s cubic-bezier(.2,.7,.2,1)}
  .o-more[hidden]{display:block;height:0}
  .o-toggle{display:block;margin:1.5rem auto 0;text-decoration:underline;text-underline-offset:.2em;transition:color .2s}
  .o-toggle:hover{color:var(--live)}

  /* the facts table: a ruled list, label on the left, value on the right */
  .o-facts{margin:clamp(2rem,5vh,3rem) auto 0;border-bottom:1px solid var(--ink)}
  .o-facts div{display:grid;grid-template-columns:9rem minmax(0,1fr);gap:1rem;align-items:baseline;padding:.55rem .25rem;border-top:1px solid var(--ink)}
  .o-facts dt{margin:0}
  .o-facts dd{margin:0;font-size:.92rem}

  /* images: a grid of thirds, built on 6 tracks so that a pair of halves also fits (two tracks plus a
     gutter is exactly one third). The row height is one third of the width at the photos' own 3:2, so
     a small tile is 1 third x 1 row, a big one 2x2, a tall one 1x2 and a full-width one 3x3, all close
     to 3:2; a half is 3 tracks x 3 rows, close to 3:4. Gutters as on oma.com: 2.36% of the column
     across, 1em down. */
  .o-images{container-type:inline-size;margin-top:3em}
  .o-grid{
    --gx:2.35765cqw;
    display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
    grid-auto-rows:calc((100cqw - 2 * var(--gx)) / 3 / 1.5);
    grid-auto-flow:dense;column-gap:var(--gx);row-gap:1em;
  }
  .o-fig{grid-column:span 2;margin:0;position:relative;overflow:hidden;cursor:zoom-in;background:var(--rule)}
  .o-fig img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1),opacity .4s}
  .o-fig:hover img{transform:scale(1.02)}
  .o-fig.is-drawing{background:#fff}
  .o-fig.is-drawing img{object-fit:contain}
  .o-fig.is-drawing:hover img{transform:none}
  .o-fig.is-drawing.is-fill img{object-fit:cover}   /* a drawing on its own tinted paper fills the tile */
  .o-fig--big{grid-column:span 4;grid-row:span 2}
  .o-fig--tall{grid-row:span 2}
  .o-fig--full{grid-column:1 / -1;grid-row:span 3}
  .o-fig--wide{grid-column:1 / -1;grid-row:span 2}   /* about 2.3:1, for a long drawing */
  .o-fig--xl{grid-column:span 4;grid-row:span 3}      /* about 1:1 */
  .o-fig--tower{grid-row:span 3}                      /* about 1:2 */
  .o-fig--half{grid-column:span 3;grid-row:span 3}    /* about 3:4, two side by side */

  /* more from the same group, small and even, like OMA's related rows */
  .o-related{margin-top:clamp(4rem,12vh,8rem);padding-top:.8rem;border-top:1px solid var(--rule)}
  .o-related__head{display:flex;justify-content:space-between;color:var(--mute);margin-bottom:1.1rem}
  .o-related__list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--g)}
  .o-card{display:block}
  .o-card__img{aspect-ratio:3/2;overflow:hidden;background:hsl(var(--h,0) 22% 72%)}
  .o-card__img img{display:block;width:100%;height:100%;object-fit:cover}
  .o-card__name{display:block;margin-top:.55rem;font-weight:600;font-size:.95rem;transition:color .2s}
  .o-card:hover .o-card__name{color:var(--live)}
  .o-card .mono{display:block;margin-top:.15rem;color:var(--mute)}

  /* the full-screen viewer */
  .lightbox{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s ease;cursor:zoom-out}
  .lightbox.on{opacity:1}
  .lightbox img{display:block;max-width:94vw;max-height:calc(100svh - 7rem);object-fit:contain}
  .lightbox__cap{position:absolute;left:var(--pad);bottom:1.2rem;color:var(--mute)}
  .lightbox__count{position:absolute;right:var(--pad);bottom:1.2rem;color:var(--mute)}
  .lb-nav{position:absolute;top:0;bottom:0;width:20vw;cursor:pointer}
  .lb-nav--l{left:0;cursor:w-resize}
  .lb-nav--r{right:0;cursor:e-resize}

  footer{
    display:flex;justify-content:space-between;gap:1rem;
    margin-top:clamp(4rem,12vh,8rem);
    padding:1.1rem var(--pad);
    font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.03em;color:var(--mute);
  }

  @media (max-width:700px){
    .o-related__list{grid-template-columns:repeat(2,minmax(0,1fr))}
    .o-facts div{grid-template-columns:6.5rem minmax(0,1fr)}
  }
  @media (max-width:480px){
    /* on a phone the text takes the full column and the grid becomes one column, every image whole at
       its own proportions */
    .col{width:calc(100% - 2em)}
    .o-grid{display:block}
    .o-fig{margin-bottom:1em;cursor:default}
    .o-fig img{height:auto}
  }
  @media (max-width:640px){
    .gv-mark{width:170px;font-size:10.5px}
    .bar{gap:1.75rem}
    .bar nav{gap:.85rem}
    .bar > nav > .switch{display:none}
    .settings-btn{display:flex;align-items:center;justify-content:center;padding:.3rem}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important}
  }
</style>
</head>
<body>

<header class="bar">
  <a href="/" class="gv-mark" id="home" aria-label="Gonzalo Cáceres Valcárcel — home">
    <span class="gv-mark__line">
      <span>G</span><span>O</span><span class="gv-mark__flip">N</span><span>Z</span><span>A</span><span>L</span><span>O</span>
      <span class="gv-mark__gap">&nbsp;</span>
      <span>C</span><span>Á</span><span>C</span><span>E</span><span class="gv-mark__flip">R</span><span>E</span><span>S</span>
    </span>
    <span class="gv-mark__line">
      <span>V</span><span>A</span><span class="gv-mark__flip">L</span><span>C</span><span>Á</span><span>R</span><span>C</span><span>E</span><span>L</span>
    </span>
  </a>
  <nav>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <button class="switch theme-switch" id="theme" role="switch" aria-checked="false" aria-label="Dark mode">
      <span class="switch-label">Dark mode</span>
      <span class="switch-track"><span class="switch-knob"></span></span>
    </button>
    <button class="settings-btn" id="settingsBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"></line><circle cx="15" cy="6" r="2.1"></circle>
        <line x1="3" y1="12" x2="21" y2="12"></line><circle cx="9" cy="12" r="2.1"></circle>
        <line x1="3" y1="18" x2="21" y2="18"></line><circle cx="17" cy="18" r="2.1"></circle>
      </svg>
    </button>
    <div class="settings-panel" id="settingsPanel" hidden>
      <div class="settings-row">
        <span class="mono">Dark mode</span>
        <button class="switch theme-switch" type="button" role="switch" aria-checked="false" aria-label="Dark mode">
          <span class="switch-track"><span class="switch-knob"></span></span>
        </button>
      </div>
      <div class="settings-row">
        <span class="mono">Language</span>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" class="lang-opt is-on" data-lang="en">EN</button>
          <button type="button" class="lang-opt" data-lang="es">ES</button>
        </div>
      </div>
    </div>
  </nav>
</header>

<main id="app"></main>

<footer>
  <span>Architecture and development. Based in New York.</span>
  <span>&copy; 2026</span>
</footer>

<script src="projects.js"></script>
<script>
(function(){
  var slug = new URLSearchParams(location.search).get('p') || 'anticlastic-roof-structure';
  var p = window.PROJECTS[slug];
  var app = document.getElementById('app');
  if(!p){ app.textContent = 'Unknown project.'; return; }
  document.title = p.title + ' — Gonzalo Cáceres';

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text != null) n.textContent = text;
    return n;
  }

  var bar = document.querySelector('.bar');
  function setBar(){ document.documentElement.style.setProperty('--bar-h', bar.offsetHeight + 'px'); }
  setBar();
  window.addEventListener('resize', setBar);

  // the project name in the bar, once the hero has scrolled away
  var ptitle = el('a', 'ptitle', p.title);
  ptitle.href = '#';
  ptitle.addEventListener('click', function(e){ e.preventDefault(); window.scrollTo({top: 0, behavior: 'smooth'}); });
  bar.appendChild(ptitle);

  // ---- hero ----
  if(p.hero){
    var hero = el('figure', 'o-hero');
    var himg = el('img');
    // the frame reserves 3:2 until the picture arrives, then takes the picture's own proportions
    himg.addEventListener('load', function(){ if(himg.naturalWidth) hero.style.aspectRatio = himg.naturalWidth + ' / ' + himg.naturalHeight; });
    himg.src = p.hero; himg.alt = p.title;
    hero.appendChild(himg);
    app.appendChild(hero);
    new IntersectionObserver(function(es){ ptitle.classList.toggle('on', !es[0].isIntersecting); }, {rootMargin: '-80px 0px 0px 0px'}).observe(hero);
  } else {
    ptitle.classList.add('on');
  }

  // ---- title, text, "Read more" ----
  var head = el('section', 'col o-head');
  head.appendChild(el('h1', 'o-title', p.title));   // no kicker line under it: place and year are in the facts
  if(p.lede) head.appendChild(el('p', 'o-lede', p.lede));
  var paras = p.text ? [].concat(p.text) : [];
  if(paras.length) head.appendChild(el('p', 'o-text', paras[0]));
  if(paras.length > 1){
    var more = el('div', 'o-more');
    paras.slice(1).forEach(function(t){ more.appendChild(el('p', 'o-text', t)); });
    more.hidden = true;
    head.appendChild(more);
    var toggle = el('button', 'o-toggle', 'Read more');
    toggle.type = 'button';
    toggle.setAttribute('aria-expanded', 'false');
    toggle.addEventListener('click', function(){
      var open = more.hidden;
      if(open){
        more.hidden = false;
        more.style.height = more.scrollHeight + 'px';
      } else {
        more.style.height = more.scrollHeight + 'px';
        void more.offsetHeight;
        more.style.height = '0px';
      }
      toggle.textContent = open ? 'Read less' : 'Read more';
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
    more.addEventListener('transitionend', function(){
      if(more.style.height === '0px') more.hidden = true;
      else more.style.height = 'auto';
    });
    head.appendChild(toggle);
  }

  // ---- facts ----
  if(p.credits && p.credits.length){
    var dl = el('dl', 'o-facts');
    p.credits.forEach(function(c){
      var row = el('div');
      row.appendChild(el('dt', 'mono', c[0]));
      row.appendChild(el('dd', '', c[1]));
      dl.appendChild(row);
    });
    head.appendChild(dl);
  }
  app.appendChild(head);

  // ---- images ----
  // Every picture the project has, in one sequence. Photos and the physical models are cropped to fill
  // their tile; drawings are shown whole. The size of each tile follows a fixed rhythm (see SIZES):
  // a full-width image, a big one with two small beside it, a row of three, and so on. A portrait
  // picture (the hand drawing) takes a tall tile wherever it falls.
  var g = p.gallery || {};
  var items = [];
  (g.physical || []).forEach(function(it){ items.push({src: it.src, caption: it.text || p.physicalNote || it.caption}); });
  (g.photos || []).forEach(function(it){ items.push({src: it.src, caption: it.caption}); });
  var drawings = (g.drawings || []).map(function(it){ return {src: it.src, caption: it.caption, drawing: true}; });
  if(p.diagram && p.diagram.src) drawings.unshift({src: p.diagram.src, caption: p.diagram.caption, drawing: true, tall: true});

  // the sequence: interleave the drawings between the photos, a block of them after the opening images
  var seq = [];
  if(slug === 'anticlastic-roof-structure' && items.length >= 10 && drawings.length >= 4){
    // hand-tuned for this test: full, big + 2, three drawings, full, hand drawing (tall) + big, 3 small, full
    var P = items, D = drawings;
    seq = [
      [P[0], 'full'],
      [P[1], 'big'], [P[2]], [P[3]],
      [D[1]], [D[2]], [D[3]],
      [P[4], 'full'],
      [D[0], 'tall'], [P[5], 'big'],
      [P[6]], [P[7]], [P[8]],
      [P[9], 'full']
    ];
  } else if(slug === 'sierra-hotel' && items.length >= 8 && drawings.length >= 4){
    // hand-tuned for this test: most Sierra photos are portrait 3:4, so they go three at a time in tall
    // tiles (1 column x 2 rows, close to 3:4) instead of being cropped to landscape. The one landscape
    // photo opens full width; the facade render sits beside the exploded axonometric; the facade drawing
    // and an exterior photo share a row as halves; the floor plans take a wide band; three
    // interior/garden photos close the page.
    var P = items, D = drawings;   // P[7] is the render; D: axonometric, facade, floor plans, details
    seq = [
      [{src: 'img/sierra-hotel/photo-4-crop.jpg', caption: P[3].caption}, 'full'],   // cropped below the white slab
      [P[7], 'xl'], [D[0], 'tower', 'fill'],   // the axonometric's grey paper is cropped at the sides only
      // the front elevation redrawn from the approved facade CAD file, in place of the facade drawing D[1]
      [{src: 'img/sierra-hotel/elevation.svg', caption: 'Front elevation', drawing: true}, 'half'], [P[4], 'half'],
      // P[5] (side facade) and P[6] (scaffolding) are left out here,
      // and so are the facade details (D[3]). The floor plans use the redrawn version here.
      [{src: 'img/sierra-hotel/floor-plans.svg', caption: D[2].caption, drawing: true}, 'wide'],
      [P[0], 'half'], [P[2], 'half']   // tiles and corridor close the page (the garden photo P[1] is left out)
    ];
  } else {
    // any other project: the same rhythm, filled in order
    var all = items.concat(drawings), SIZES = ['full', 'big', '', '', '', '', ''];
    seq = all.map(function(it, i){ return [it, it.tall ? 'tall' : SIZES[i % SIZES.length]]; });
  }

  var lbList = [];
  if(seq.length){
    var wrap = el('section', 'col col--wide o-images');
    var grid = el('div', 'o-grid');
    seq.forEach(function(pair){
      var it = pair[0], size = pair[1];
      var fig = el('figure', 'o-fig' + (size ? ' o-fig--' + size : '') + (it.drawing ? ' is-drawing' : '') + (pair[2] === 'fill' ? ' is-fill' : ''));
      var img = el('img');
      img.src = it.src; img.alt = it.caption || ''; img.loading = 'lazy'; img.decoding = 'async';
      fig.appendChild(img);
      var idx = lbList.push(it) - 1;
      fig.addEventListener('click', function(){ if(!phone.matches) openLightbox(idx); });
      grid.appendChild(fig);
    });
    wrap.appendChild(grid);
    app.appendChild(wrap);
  }

  // ---- more from the same group ----
  var others = Object.keys(window.PROJECTS).filter(function(k){ return k !== slug && window.PROJECTS[k].group === p.group; });
  if(others.length){
    var rel = el('section', 'col col--wide o-related');
    var rh = el('div', 'o-related__head mono');
    rh.appendChild(el('span', '', 'More ' + p.group));
    rh.appendChild(el('span', '', String(others.length)));
    rel.appendChild(rh);
    var list = el('div', 'o-related__list');
    others.forEach(function(k){
      var q = window.PROJECTS[k];
      var a = el('a', 'o-card');
      a.href = 'project.html?p=' + k;
      var box = el('div', 'o-card__img');
      box.style.setProperty('--h', q.hue || 0);
      if(q.hero){ var im = el('img'); im.src = q.hero; im.alt = ''; im.loading = 'lazy'; box.appendChild(im); }
      a.appendChild(box);
      a.appendChild(el('span', 'o-card__name', q.title));
      if(q.kicker) a.appendChild(el('span', 'mono', q.kicker));
      list.appendChild(a);
    });
    rel.appendChild(list);
    app.appendChild(rel);
  }

  // ---- lightbox ----
  var phone = window.matchMedia('(max-width:480px)');
  var lb = null, lbAt = 0;
  function renderLightbox(){
    lb.innerHTML = '';
    var it = lbList[lbAt];
    var img = el('img'); img.src = it.src; img.alt = it.caption || '';
    lb.appendChild(img);
    if(it.caption) lb.appendChild(el('span', 'lightbox__cap mono', it.caption));
    lb.appendChild(el('span', 'lightbox__count mono', (lbAt + 1) + ' / ' + lbList.length));
    var l = el('div', 'lb-nav lb-nav--l'), r = el('div', 'lb-nav lb-nav--r');
    l.addEventListener('click', function(e){ e.stopPropagation(); step(-1); });
    r.addEventListener('click', function(e){ e.stopPropagation(); step(1); });
    lb.appendChild(l); lb.appendChild(r);
  }
  function openLightbox(i){
    lbAt = i;
    lb = el('div', 'lightbox');
    lb.addEventListener('click', closeLightbox);
    renderLightbox();
    document.body.appendChild(lb);
    requestAnimationFrame(function(){ lb.classList.add('on'); });
  }
  function closeLightbox(){
    if(!lb) return;
    var n = lb; lb = null;
    n.classList.remove('on');
    setTimeout(function(){ n.remove(); }, 300);
  }
  function step(d){ lbAt = (lbAt + d + lbList.length) % lbList.length; renderLightbox(); }
  document.addEventListener('keydown', function(e){
    if(!lb) return;
    if(e.key === 'Escape') closeLightbox();
    else if(e.key === 'ArrowRight') step(1);
    else if(e.key === 'ArrowLeft') step(-1);
  });
})();
</script>
<script>
(function(){
  var switches = Array.prototype.slice.call(document.querySelectorAll('.theme-switch'));
  function isDark(){
    var a = document.documentElement.getAttribute('data-theme');
    if(a === 'dark') return true;
    if(a === 'light') return false;
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function sync(){ switches.forEach(function(b){ b.setAttribute('aria-checked', isDark() ? 'true' : 'false'); }); }
  sync();
  switches.forEach(function(b){
    b.addEventListener('click', function(){
      var next = isDark() ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try{ sessionStorage.setItem('gc-theme', next); }catch(e){}
      sync();
    });
  });
  try{
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    mq.addEventListener('change', function(){
      document.documentElement.removeAttribute('data-theme');
      try{ sessionStorage.removeItem('gc-theme'); }catch(e){}
      sync();
    });
  }catch(e){}

  var settingsBtn = document.getElementById('settingsBtn'), settingsPanel = document.getElementById('settingsPanel');
  if(settingsBtn && settingsPanel){
    var closeSettings = function(){
      settingsPanel.classList.remove('on');
      settingsBtn.setAttribute('aria-expanded', 'false');
      setTimeout(function(){ if(!settingsPanel.classList.contains('on')) settingsPanel.hidden = true; }, 0);
    };
    settingsBtn.addEventListener('click', function(e){
      e.stopPropagation();
      if(settingsPanel.classList.contains('on')){ closeSettings(); return; }
      settingsPanel.hidden = false;
      settingsPanel.classList.add('on');
      settingsBtn.setAttribute('aria-expanded', 'true');
    });
    document.addEventListener('click', function(e){
      if(settingsPanel.classList.contains('on') && !settingsPanel.contains(e.target) && e.target !== settingsBtn) closeSettings();
    });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeSettings(); });
  }

  var langBtns = Array.prototype.slice.call(document.querySelectorAll('.lang-opt'));
  if(langBtns.length){
    var syncLang = function(lang){
      langBtns.forEach(function(b){ b.classList.toggle('is-on', b.getAttribute('data-lang') === lang); });
    };
    var savedLang = 'en';
    try{ savedLang = localStorage.getItem('gc-lang') || 'en'; }catch(e){}
    syncLang(savedLang);
    langBtns.forEach(function(b){
      b.addEventListener('click', function(){
        var lang = b.getAttribute('data-lang');
        syncLang(lang);
        try{ localStorage.setItem('gc-lang', lang); }catch(e){}
      });
    });
  }
})();
</script>
