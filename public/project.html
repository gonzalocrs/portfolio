<script>if(/^((?!chrome|chromium|crios|fxios|edg|opr|android).)*safari/i.test(navigator.userAgent)){document.querySelectorAll('link[rel="icon"]').forEach(function(l){l.remove();});var fi=document.createElement('link');fi.rel='icon';fi.type='image/png';fi.href='fav/logo-grey.png?v=7';document.head.appendChild(fi);}</script>
