<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project — Gonzalo Cáceres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  try{var s=localStorage.getItem('gc-theme');if(s)document.documentElement.setAttribute('data-theme',s)}catch(e){}
</script>
<style>
  :root{
    --paper:#ffffff;
    --ink:#0f1216;
    --rule:#d8d6d1;
    --mute:#7b7d80;
    --live:#1a2ce0;
    --font:"Archivo","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
    --pad:clamp(1rem,4vw,2.5rem);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#0d0e10;
      --ink:#f2f1ee;
      --rule:#2b2d30;
      --mute:#8b8d90;
      --live:#7d8bff;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0d0e10;
    --ink:#f2f1ee;
    --rule:#2b2d30;
    --mute:#8b8d90;
    --live:#7d8bff;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font);
    font-size:16px;
    line-height:1.4;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--live);outline-offset:3px}

  /* ---------- top bar (same as the index) ---------- */
  .bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:1rem;
    padding:1.1rem var(--pad);
    font-family:var(--mono);
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .bar nav{display:flex;align-items:center;gap:1.25rem}
  .bar a:hover{color:var(--live)}

  .gv-mark{
    display:block;
    width:230px;
    font-family:'Archivo',sans-serif;
    font-weight:300;
    font-size:14px;
    color:var(--ink);
    text-decoration:none;
  }
  .gv-mark__line{display:flex;justify-content:space-between;line-height:1}
  .gv-mark__gap{flex:0 0 .8em}
  /* optical alignment: the V lines up under the G and the last L under the S */
  .gv-mark__line + .gv-mark__line > span:first-child{margin-left:.047em}
  .gv-mark__line + .gv-mark__line > span:last-child{margin-right:.046em}
  .gv-mark__flip{
    display:inline-block;
    transform:scaleX(-1);
    transition:transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .gv-mark:hover .gv-mark__flip,
  .gv-mark:focus-visible .gv-mark__flip{transform:scaleX(1)}

  .switch{
    display:inline-flex;
    align-items:center;
    gap:.55rem;
    font-family:var(--mono);
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .switch:hover .switch-label{color:var(--live)}
  .switch-track{
    position:relative;flex:0 0 auto;
    width:32px;height:18px;
    border-radius:6px;
    background:var(--rule);
    transition:background .25s ease;
  }
  .switch[aria-checked="true"] .switch-track{background:var(--live)}
  .switch-knob{
    position:absolute;top:2px;left:2px;
    width:14px;height:14px;
    border-radius:3px;
    background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.35),0 1px 1px rgba(0,0,0,.18);
    transition:transform .25s cubic-bezier(.2,.7,.2,1);
  }
  .switch[aria-checked="true"] .switch-knob{transform:translateX(14px)}

  /* ---------- project page ---------- */
  main{
    flex:1 0 auto;
    padding:clamp(1rem,3vh,2rem) var(--pad) clamp(3rem,8vh,6rem);
  }
  .mono{
    font-family:var(--mono);
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .back{display:inline-block;margin-bottom:1.25rem;color:var(--mute);transition:color .2s}
  .back:hover{color:var(--live)}

  .hero{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    max-height:80vh;
    border:1px solid var(--rule);
    overflow:hidden;
  }

  .title{
    margin:clamp(2rem,5vw,3.5rem) 0 0;
    font-weight:800;
    font-size:clamp(1.9rem,7.4vw,6.5rem);
    line-height:.9;
    letter-spacing:-.02em;
  }
  .kicker{margin-top:1rem;color:var(--mute)}

  .info{
    display:grid;
    grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);
    gap:clamp(2rem,6vw,6rem);
    margin-top:clamp(2rem,5vw,3.5rem);
    align-items:start;
  }
  .info.solo{grid-template-columns:minmax(0,38rem)}
  .lede.placeholder,.text.placeholder{font-style:italic;font-weight:400;color:var(--mute)}
  .lede{
    margin:0 0 1.4rem;
    max-width:34ch;
    font-weight:500;
    font-size:clamp(1.15rem,1.7vw,1.5rem);
    line-height:1.4;
    letter-spacing:-.015em;
  }
  .text{margin:0;max-width:52ch;font-size:1rem;line-height:1.6;color:var(--mute)}

  .credits{margin:0;border-bottom:1px solid var(--rule)}
  .credits div{
    display:grid;
    grid-template-columns:8.5rem minmax(0,1fr);
    gap:1rem;
    align-items:baseline;
    padding:.65rem 0;
    border-top:1px solid var(--rule);
  }
  .credits dt{color:var(--mute)}
  .credits dd{margin:0;font-weight:500}

  /* ---------- gallery ---------- */
  .gal{margin-top:clamp(3.5rem,9vw,7rem)}
  .gal__head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:.8rem 0 1.4rem;
    border-top:1px solid var(--rule);
  }
  .gal__head span:last-child{color:var(--mute)}
  .grid{
    display:grid;
    grid-template-columns:repeat(12,minmax(0,1fr));
    gap:clamp(1rem,2vw,1.75rem) clamp(.75rem,1.6vw,1.5rem);
  }
  .fig{margin:0}
  .frame{position:relative;width:100%;border:1px solid var(--rule);overflow:hidden}
  .fig figcaption{
    display:flex;
    gap:1em;
    margin-top:.55rem;
    color:var(--mute);
  }
  .s12{grid-column:span 12}
  .s8{grid-column:span 8}
  .s6{grid-column:span 6}
  .s4{grid-column:span 4}
  .r-wide{aspect-ratio:16/9}
  .r-43{aspect-ratio:4/3}
  .r-34{aspect-ratio:3/4}
  .r-11{aspect-ratio:1/1}

  /* placeholder artwork until real files are dropped in */
  .art{position:absolute;inset:0}
  .art--photo{
    background:repeating-linear-gradient(135deg,hsl(var(--h) 30% 62%) 0 6px,hsl(var(--h) 30% 68%) 6px 12px);
  }
  .art--drawing{
    background:
      linear-gradient(var(--rule) 1px,transparent 1px) 0 0/24px 24px,
      linear-gradient(90deg,var(--rule) 1px,transparent 1px) 0 0/24px 24px;
  }
  .art--drawing::before,
  .art--drawing::after{content:"";position:absolute;border:1.5px solid var(--ink);opacity:.5}
  .art--drawing::before{inset:16% 12%}
  .art--drawing::after{left:12%;top:16%;width:38%;height:36%}
  .art--physical{
    background:
      repeating-linear-gradient(120deg,transparent 0 9px,hsl(38 10% 38% / .3) 9px 10px),
      hsl(38 18% 76%);
  }

  .cap{
    position:absolute;left:.6rem;bottom:.6rem;
    padding:.25em .55em;
    background:var(--paper);
    color:var(--mute);
    max-width:calc(100% - 1.2rem);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .end{
    display:block;
    margin-top:clamp(3.5rem,9vw,7rem);
    padding-top:1.25rem;
    border-top:1px solid var(--rule);
  }
  .end .mono{display:block;color:var(--mute)}
  .end strong{
    display:block;
    margin-top:.5rem;
    font-weight:800;
    font-size:clamp(1.6rem,4.4vw,3.4rem);
    line-height:.95;
    letter-spacing:-.04em;
    transition:color .2s;
  }
  .end:hover strong{color:var(--live)}

  footer{
    display:flex;
    justify-content:space-between;
    gap:1rem;
    padding:1.1rem var(--pad);
    font-family:var(--mono);
    font-size:.68rem;
    text-transform:uppercase;
    letter-spacing:.03em;
    color:var(--mute);
  }

  @media (max-width:900px){
    .info{grid-template-columns:1fr}
    .lede{max-width:none}
    .text{max-width:none}
  }
  @media (max-width:640px){
    .gv-mark{width:170px;font-size:10.5px}
    .s8,.s6,.s4{grid-column:span 12}
    .credits div{grid-template-columns:6.5rem minmax(0,1fr)}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important}
  }
</style>
</head>
<body>

<header class="bar">
  <a href="/" class="gv-mark" id="home" aria-label="Gonzalo Cáceres Valcárcel — home">
    <span class="gv-mark__line">
      <span>G</span><span>O</span><span class="gv-mark__flip">N</span><span>Z</span><span>A</span><span>L</span><span>O</span>
      <span class="gv-mark__gap">&nbsp;</span>
      <span>C</span><span>Á</span><span>C</span><span>E</span><span class="gv-mark__flip">R</span><span>E</span><span>S</span>
    </span>
    <span class="gv-mark__line">
      <span>V</span><span>A</span><span class="gv-mark__flip">L</span><span>C</span><span>Á</span><span>R</span><span>C</span><span>E</span><span>L</span>
    </span>
  </a>
  <nav>
    <a href="about.html">About</a>
    <a href="mailto:hello@example.com">Contact</a>
    <button class="switch" id="theme" role="switch" aria-checked="false" aria-label="Dark mode">
      <span class="switch-label">Dark mode</span>
      <span class="switch-track"><span class="switch-knob"></span></span>
    </button>
  </nav>
</header>

<main id="app"></main>

<footer>
  <span>Architecture and development. Based in New York.</span>
  <span>&copy; 2026</span>
</footer>

<script src="projects.js"></script>
<script src="project.js"></script>
<script>
(function(){
  var btn = document.getElementById('theme');
  function isDark(){
    var a = document.documentElement.getAttribute('data-theme');
    if(a === 'dark') return true;
    if(a === 'light') return false;
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function sync(){ btn.setAttribute('aria-checked', isDark() ? 'true' : 'false'); }
  sync();
  btn.addEventListener('click', function(){
    var next = isDark() ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('gc-theme', next); }catch(e){}
    sync();
  });
})();
</script>

</body>
</html>
